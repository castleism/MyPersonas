<svg viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="45%" r="75%">
      <stop offset="0%" stop-color="#141a38"/>
      <stop offset="55%" stop-color="#0a0e22"/>
      <stop offset="100%" stop-color="#04060f"/>
    </radialGradient>
    <linearGradient id="fem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ff7ac2"/>
      <stop offset="60%" stop-color="#c05ce8"/>
      <stop offset="100%" stop-color="#6b2fd6"/>
    </linearGradient>
    <linearGradient id="masc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4de3ff"/>
      <stop offset="60%" stop-color="#2b8cff"/>
      <stop offset="100%" stop-color="#1a3fd6"/>
    </linearGradient>
    <linearGradient id="seam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity=".9"/>
      <stop offset="30%" stop-color="#b48cff" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softglow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <g id="soulfig">
      <circle cx="0" cy="-70" r="26"/>
      <path d="M -34 -28 Q 0 -46 34 -28 L 40 40 Q 20 52 0 52 Q -20 52 -40 40 Z"/>
    </g>
    <clipPath id="leftHalf"><rect x="600" y="140" width="200" height="640"/></clipPath>
    <clipPath id="rightHalf"><rect x="800" y="140" width="200" height="640"/></clipPath>
  </defs>

  <rect width="1600" height="900" fill="url(#bg)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle cx="120" cy="90" r="1.6" opacity=".7"/><circle cx="300" cy="200" r="1.1" opacity=".5"/>
    <circle cx="520" cy="70" r="1.4" opacity=".6"/><circle cx="1480" cy="120" r="1.6" opacity=".7"/>
    <circle cx="1320" cy="60" r="1.1" opacity=".5"/><circle cx="1100" cy="150" r="1.3" opacity=".5"/>
    <circle cx="200" cy="620" r="1.2" opacity=".5"/><circle cx="90" cy="420" r="1.5" opacity=".6"/>
    <circle cx="1520" cy="500" r="1.3" opacity=".6"/><circle cx="1400" cy="760" r="1.4" opacity=".5"/>
    <circle cx="640" cy="60" r="1" opacity=".4"/><circle cx="980" cy="80" r="1.2" opacity=".5"/>
    <circle cx="420" cy="800" r="1.2" opacity=".4"/><circle cx="1180" cy="820" r="1.2" opacity=".4"/>
  </g>

  <!-- sacred geometry rings -->
  <g fill="none" stroke="#8f7bff" opacity=".28">
    <circle cx="800" cy="450" r="330" stroke-width="1.4"/>
    <circle cx="800" cy="450" r="268" stroke-width="1" stroke-dasharray="4 10"/>
    <circle cx="800" cy="450" r="405" stroke-width="1" stroke-dasharray="2 14"/>
    <polygon points="800,120 1086,285 1086,615 800,780 514,615 514,285" stroke-width="1" opacity=".8"/>
  </g>

  <!-- aura halo -->
  <circle cx="800" cy="430" r="300" fill="url(#halo)"/>

  <!-- light threads to projections -->
  <g fill="none" stroke-width="2" opacity=".55" filter="url(#softglow)">
    <path d="M 800 380 C 640 300 520 300 400 250" stroke="#ff7ac2"/>
    <path d="M 800 380 C 660 420 520 480 360 470" stroke="#c05ce8"/>
    <path d="M 800 420 C 680 560 560 640 430 680" stroke="#ff9d5c"/>
    <path d="M 800 380 C 960 300 1080 290 1200 240" stroke="#4de3ff"/>
    <path d="M 800 380 C 940 420 1080 480 1240 465" stroke="#2b8cff"/>
    <path d="M 800 420 C 920 560 1040 640 1170 680" stroke="#59ffb2"/>
    <path d="M 800 330 C 800 240 800 200 800 150" stroke="#ffffff" opacity=".8"/>
  </g>

  <!-- circuit traces (tech side) -->
  <g fill="none" stroke="#4de3ff" stroke-width="1.3" opacity=".5">
    <path d="M 860 460 h 60 v -40 h 70"/>
    <path d="M 860 520 h 90 v 50 h 60"/>
    <path d="M 850 400 h 50 v -60 h 80"/>
    <circle cx="990" cy="420" r="3.5" fill="#4de3ff"/>
    <circle cx="1010" cy="570" r="3.5" fill="#4de3ff"/>
    <circle cx="980" cy="340" r="3.5" fill="#4de3ff"/>
  </g>
  <!-- spirit wisps (soul side) -->
  <g fill="none" stroke="#ff7ac2" stroke-width="1.6" opacity=".45">
    <path d="M 740 460 C 690 440 680 400 630 405 C 590 410 580 380 545 385"/>
    <path d="M 745 520 C 700 545 665 530 630 560 C 600 585 560 575 535 595"/>
    <path d="M 750 395 C 710 370 700 330 655 330"/>
  </g>

  <!-- central figure -->
  <g>
    <!-- crown light -->
    <circle cx="800" cy="150" r="18" fill="#ffffff" opacity=".9" filter="url(#glow)"/>
    <!-- body: left (feminine, spiritual) -->
    <g clip-path="url(#leftHalf)">
      <path d="M 800 190 C 742 190 726 240 728 274 C 729 300 740 318 736 340 C 720 352 700 366 700 400 C 700 470 738 500 740 560 C 742 620 726 700 712 780 L 800 780 Z"
        fill="url(#fem)" opacity=".95"/>
      <!-- flowing hair -->
      <path d="M 800 190 C 730 195 700 260 705 330 C 708 372 690 400 672 430 C 700 420 720 400 730 380 C 726 300 740 240 800 215 Z"
        fill="url(#fem)" opacity=".55"/>
    </g>
    <!-- body: right (masculine, tech) -->
    <g clip-path="url(#rightHalf)">
      <path d="M 800 190 C 860 190 876 242 874 276 C 873 302 864 318 868 342 C 888 354 904 368 904 402 C 904 470 866 500 862 560 C 858 622 874 700 888 780 L 800 780 Z"
        fill="url(#masc)" opacity=".95"/>
      <!-- angular tech facets -->
      <path d="M 810 260 l 46 10 l -6 40 l -40 -8 Z M 816 340 l 52 12 l -8 44 l -44 -10 Z" fill="#0a2a55" opacity=".5"/>
      <path d="M 812 250 v 300" stroke="#9fe8ff" stroke-width="1" opacity=".5" fill="none"/>
    </g>
    <!-- head -->
    <g>
      <circle cx="800" cy="235" r="47" fill="url(#fem)" clip-path="url(#leftHalf)"/>
      <circle cx="800" cy="235" r="47" fill="url(#masc)" clip-path="url(#rightHalf)"/>
    </g>
    <!-- glowing seam -->
    <rect x="797.5" y="150" width="5" height="630" fill="url(#seam)" filter="url(#glow)"/>
    <!-- heart core -->
    <circle cx="800" cy="400" r="16" fill="#ffffff" filter="url(#glow)"/>
    <circle cx="800" cy="400" r="34" fill="none" stroke="#ffffff" stroke-width="1.4" opacity=".6"/>
  </g>

  <!-- holographic persona projections -->
  <g font-family="Segoe UI, Arial, sans-serif" font-size="15" font-weight="600" text-anchor="middle">
    <!-- each: translucent holo card + ghost figure -->
    <g transform="translate(400,250)" opacity=".92">
      <rect x="-72" y="-86" width="144" height="150" rx="14" fill="#ff7ac2" opacity=".12" stroke="#ff7ac2" stroke-width="1.3"/>
      <use href="#soulfig" transform="translate(0,8) scale(.8)" fill="#ffb3dc" opacity=".85" filter="url(#softglow)"/>
      <text y="52" fill="#ffc6e5">the muse</text>
    </g>
    <g transform="translate(360,470)" opacity=".92">
      <rect x="-72" y="-86" width="144" height="150" rx="14" fill="#c05ce8" opacity=".12" stroke="#c05ce8" stroke-width="1.3"/>
      <use href="#soulfig" transform="translate(0,8) scale(.8)" fill="#e0aaff" opacity=".85" filter="url(#softglow)"/>
      <text y="52" fill="#ecd0ff">the mystic</text>
    </g>
    <g transform="translate(430,680)" opacity=".92">
      <rect x="-72" y="-86" width="144" height="150" rx="14" fill="#ff9d5c" opacity=".12" stroke="#ff9d5c" stroke-width="1.3"/>
      <use href="#soulfig" transform="translate(0,8) scale(.8)" fill="#ffc9a1" opacity=".85" filter="url(#softglow)"/>
      <text y="52" fill="#ffdcbe">the artist</text>
    </g>
    <g transform="translate(1200,240)" opacity=".92">
      <rect x="-72" y="-86" width="144" height="150" rx="14" fill="#4de3ff" opacity=".12" stroke="#4de3ff" stroke-width="1.3"/>
      <use href="#soulfig" transform="translate(0,8) scale(.8)" fill="#a9f1ff" opacity=".85" filter="url(#softglow)"/>
      <text y="52" fill="#c9f6ff">the analyst</text>
    </g>
    <g transform="translate(1240,465)" opacity=".92">
      <rect x="-72" y="-86" width="144" height="150" rx="14" fill="#2b8cff" opacity=".12" stroke="#2b8cff" stroke-width="1.3"/>
      <use href="#soulfig" transform="translate(0,8) scale(.8)" fill="#9cc8ff" opacity=".85" filter="url(#softglow)"/>
      <text y="52" fill="#c4ddff">the builder</text>
    </g>
    <g transform="translate(1170,680)" opacity=".92">
      <rect x="-72" y="-86" width="144" height="150" rx="14" fill="#59ffb2" opacity=".12" stroke="#59ffb2" stroke-width="1.3"/>
      <use href="#soulfig" transform="translate(0,8) scale(.8)" fill="#a8ffd4" opacity=".85" filter="url(#softglow)"/>
      <text y="52" fill="#c9ffe4">the gamer</text>
    </g>
    <!-- crown projection -->
    <g transform="translate(800,105)" opacity=".9">
      <use href="#soulfig" transform="translate(0,-10) scale(.62)" fill="#ffffff" opacity=".8" filter="url(#softglow)"/>
      <text y="34" fill="#ffffff" opacity=".85">the true self</text>
    </g>
  </g>

  <!-- floating particles -->
  <g fill="#ffffff" opacity=".6">
    <circle cx="560" cy="330" r="2"/><circle cx="1050" cy="300" r="2"/><circle cx="620" cy="600" r="2"/>
    <circle cx="1010" cy="620" r="2"/><circle cx="700" cy="180" r="1.6"/><circle cx="900" cy="170" r="1.6"/>
  </g>
</svg>
