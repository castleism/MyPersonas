<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#1877f2">
  <meta name="robots" content="noindex">
  <title>Offline — AliaSpaces</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./brand/app-icon/favicon.ico" sizes="any">
  <link rel="icon" type="image/svg+xml" href="./brand/app-icon/icon.svg">
  <style>
    :root{color-scheme:light;--accent:#1877f2;--ink:#17324f;--muted:#526a82;--panel:#fff}
    *{box-sizing:border-box}
    body{min-height:100vh;margin:0;padding:max(24px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(24px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left));display:grid;place-items:center;background:radial-gradient(circle at 50% 18%,#fff 0,#e7f3ff 38%,#d9eafc 100%);font-family:Segoe UI,Helvetica,Arial,sans-serif;color:var(--ink)}
    main{width:min(100%,480px);padding:34px;text-align:center;background:var(--panel);border:1px solid rgba(24,119,242,.18);border-radius:22px;box-shadow:0 18px 55px rgba(23,50,79,.14)}
    img{width:96px;height:96px;border-radius:22px;box-shadow:0 8px 24px rgba(24,119,242,.22)}
    h1{margin:20px 0 8px;font-size:clamp(28px,8vw,40px);line-height:1.1}
    p{margin:0 auto 20px;color:var(--muted);font-size:16px;line-height:1.55}
    a{display:inline-block;min-height:44px;padding:12px 22px;border-radius:9px;background:var(--accent);color:#fff;font-weight:700;text-decoration:none}
    a:hover{background:#166fe5}
    a:focus-visible{outline:3px solid #0b5bd3;outline-offset:3px}
    small{display:block;margin-top:18px;color:var(--muted);line-height:1.4}
  </style>
</head>
<body>
  <main>
    <img src="./brand/app-icon/icon.svg" alt="">
    <h1>You’re offline</h1>
    <p>Reconnect to load your personas and current approvals. AliaSpaces does not store authenticated API responses or private persona data in its offline cache.</p>
    <a href="./">Try again</a>
    <small>This offline screen cannot publish, approve, or change anything.</small>
  </main>
</body>
</html>
