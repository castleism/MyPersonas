#siteMenu button{display:block;width:100%;text-align:left;background:none;border:none;padding:10px 14px;font-size:14px;font-weight:600;color:var(--text);cursor:pointer;font-family:inherit}
#siteMenu button:hover{background:var(--bg);color:var(--accent)}
#siteMenu .sep{border-top:1px solid var(--border);margin:4px 0}
.appbody{display:flex;align-items:flex-start;gap:0}
#personaRail{width:214px;flex-shrink:0;position:sticky;top:14px;max-height:calc(100vh - 30px);overflow:auto;padding:10px 8px;box-sizing:border-box}
#personaRail button{font-family:inherit}
.railitem,.railpersona,.railnew{display:flex;align-items:center;gap:9px;width:100%;text-align:left;background:transparent;border:0;border-radius:8px;padding:8px 10px;cursor:pointer;color:var(--text);font-size:14px;font-weight:500}
.railitem:hover,.railpersona:hover,.railnew:hover{background:#e9ebef}
.railitem.on,.railpersona.on{background:#e7f3ff;color:var(--accent);font-weight:700}
.railitem .ico,.railnew .ico{width:18px;height:18px;flex-shrink:0}
.railsec{border-bottom:1px solid var(--border);padding-bottom:8px;margin-bottom:6px}
.raillabel{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--dim);margin:12px 8px 4px;font-weight:700}
.railpersonas{display:flex;flex-direction:column;gap:2px;max-height:46vh;overflow:auto}
.railav{width:26px;height:26px;border-radius:50%;background-size:cover;background-position:center;background-color:#dfe3e8;flex-shrink:0}
.railname{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.railpersona-group{display:flex;flex-direction:column;min-width:0}
.railpersona-row{display:flex;align-items:center;gap:2px;min-width:0}
.railpersona-main{flex:1;width:auto;min-width:0}
.railbackup-toggle{display:grid;place-items:center;width:30px;height:34px;flex:0 0 30px;border:0;border-radius:8px;background:transparent;color:var(--dim);cursor:pointer;font-size:19px;line-height:1}
.railbackup-toggle:hover{background:#e9ebef;color:var(--accent)}
.railbackup-toggle[aria-expanded="true"]{color:var(--accent);transform:rotate(180deg)}
.railpersona:focus-visible,.railbackup-toggle:focus-visible{outline:3px solid rgba(24,119,242,.3);outline-offset:1px}
.railbackup-children{display:flex;flex-direction:column;margin:0 0 2px 17px;padding-left:7px;border-left:2px solid #cbd8e9}
.railbackup-children[hidden]{display:none}
.railpersona-backup{padding:6px 8px;gap:7px;font-size:13px}
.railpersona-backup .railav{width:22px;height:22px}
.railbranch{color:#7a8799;font-weight:800;flex:0 0 auto}
.railbackup-copy{display:flex;align-items:center;gap:5px;min-width:0;overflow:hidden}
.railbackup-badge{flex:0 0 auto;border:1px solid #b8c9df;border-radius:999px;padding:1px 5px;color:#536985;background:#f4f8fd;font-size:9px;font-weight:800;text-transform:uppercase;letter-spacing:.04em}
.backupeditor{margin-top:14px;padding:13px;border:1px solid #cdd9e8;border-radius:10px;background:#f8fbff}
.backupeditor h3{font-size:15px;margin:0 0 4px}
.railnew{margin-top:10px;color:var(--accent);font-weight:700;border:1px dashed var(--border)}
@media(max-width:820px){.appbody{flex-direction:column}#personaRail{width:100%;position:static;max-height:none;border-bottom:1px solid var(--border);display:flex;flex-wrap:wrap;gap:6px;align-items:center}.railsec{display:flex;gap:4px;border:0;margin:0;padding:0}.raillabel{display:none}.railpersonas{flex-direction:row;flex-wrap:wrap;max-height:none}.railpersona{width:auto}.railname{max-width:120px}.railnew{width:auto;margin:0}}
/* --- responsive additions (2026-08-12): safe-area insets + tablet tier --- */
/* Notch / home-bar safe areas. env() resolves to 0 where unsupported, so these are
   no-ops on desktop and only add clearance on notched phones/tablets. */
header{padding-top:max(10px,env(safe-area-inset-top))}
#staleBar{padding-top:max(10px,env(safe-area-inset-top))}
main{padding-left:max(24px,env(safe-area-inset-left));padding-right:max(24px,env(safe-area-inset-right));padding-bottom:max(24px,env(safe-area-inset-bottom))}
.overlay{padding:max(20px,env(safe-area-inset-top)) max(20px,env(safe-area-inset-right)) max(20px,env(safe-area-inset-bottom)) max(20px,env(safe-area-inset-left))}
.fanbox,#sdPanel{right:calc(16px + env(safe-area-inset-right));bottom:calc(16px + env(safe-area-inset-bottom))}
/* Tablet tier (iPad portrait/landscape): give the studio content a little more room. */
@media(min-width:768px) and (max-width:1024px){.cols{grid-template-columns:280px 1fr}}
/* Compact owner chrome on phones. The Menu remains the complete Overview route
   hub; persona perspective keeps its small identity-specific route set. */

  #gsearch{display:block;width:100%;min-width:0;max-width:none}

  header>#personaViewSwitcher{grid-column:1/-1;grid-row:3;width:100%;margin:0}
  header>nav>button,header>nav>.menuwrap>button{padding:7px 10px;font-size:13px}
  body:not(.persona-view-mode) header>nav>.menuwrap{display:inline-block}
  body:not(.persona-view-mode) #siteMenu{max-height:calc(100dvh - 180px - env(safe-area-inset-bottom));overflow-y:auto;overscroll-behavior:contain}
  body:not(.persona-view-mode) header>nav>button:not(#authBtn){display:none}
  body.persona-view-mode header>nav{justify-content:flex-start;overflow-x:auto;scrollbar-width:none}
  body.persona-view-mode header>nav>button[data-persona-nav]:not([hidden]),body.persona-view-mode header>nav>#primaryHomeBtn{display:inline-block!important}

  body.persona-view-mode header>nav>#authBtn{margin-left:auto}
  main{width:100%;min-width:0;padding-left:max(12px,env(safe-area-inset-left));padding-right:max(12px,env(safe-area-inset-right))}
  .matrix-head{align-items:flex-start!important}
  .matrix-actions{width:100%;min-width:0;flex-wrap:wrap}
  .matrix-actions>.btn{flex:1 1 140px;min-width:0}

// ---------- network feed pagination ----------
const FEED_PAGE=12;
function logicAndFilter(query,groups){const active=groups.filter(Boolean);if(!active.length)return query;if(active.length===1)return query.or(active[0]);return query.or(`and(${active.map(g=>`or(${g})`).join(",")})`)}
function descendingCursorGroup(createdAt,id){return createdAt&&id?`created_at.lt.${createdAt},and(created_at.eq.${createdAt},id.lt.${id})`:""}
function advanceDescendingCursor(state,rows){const last=rows&&rows[rows.length-1];if(last){state.cursorCreatedAt=last.created_at;state.cursorId=last.id}}
function newNetFeed(mode,tag,epoch){return{mode,tag,cursorCreatedAt:null,cursorId:null,busy:false,done:false,requestId:0,seenIds:new Set(),epoch}}
let netFeed=newNetFeed(null,null,renderEpoch);
function netFeedQuery(state){
  let base=sb.from("posts").select("*, personas!inner(id,name,handle,avatar_url,nsfw,theme,visibility)")
    .eq("personas.visibility","public").order("created_at",{ascending:false}).order("id",{ascending:false});
  if(state.mode==="tag")base=base.ilike("tags","%"+state.tag+"%");
  return logicAndFilter(base,[descendingCursorGroup(state.cursorCreatedAt,state.cursorId)]).limit(FEED_PAGE);
}
function netFeedFilter(rows){
  const f=getFilters();
  return (rows||[]).filter(r=>r.personas&&!(f.hideNsfw&&r.personas.nsfw)&&!isHidden(r.personas.id));
}
async function loadMoreNetFeed(){
  const state=netFeed;if(state.busy||state.done)return;
  state.busy=true;const requestId=++state.requestId;
  const btn=document.getElementById("feedMoreBtn");
  if(btn){btn.disabled=true;btn.textContent="Loading…";}
  const{data,error}=await netFeedQuery(state);
  if(netFeed!==state||state.requestId!==requestId||state.epoch!==renderEpoch)return;
  state.busy=false;
  if(error){const b=document.getElementById("feedMoreBtn");if(b){b.disabled=false;b.textContent="Try loading again"}return}
  const raw=data||[],rows=netFeedFilter(raw).filter(row=>!state.seenIds.has(row.id));
  raw.forEach(row=>state.seenIds.add(row.id));advanceDescendingCursor(state,raw);
  const wrap=document.getElementById("netFeed");
  if(wrap&&rows.length)wrap.insertAdjacentHTML("beforeend",rows.map(r=>postHtml(r,r.personas,false)).join(""));
  if(raw.length<FEED_PAGE)state.done=true;
  const b2=document.getElementById("feedMoreBtn");
  if(b2){if(state.done)b2.remove();else{b2.disabled=false;b2.textContent="Load more posts";}}
}

async function loadMorePersonaFeed(reset=false,requestedQuery=null){

async function publicFanPoll(){const ctx=publicFanCtx;if(!ctx?.started||ctx.cleared)return;try{const r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/fan-chat",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({action:"poll",personaId:ctx.personaId,sessionId:ctx.sessionId,visitorToken:ctx.visitorToken})}),j=await r.json().catch(()=>({}));if(publicFanCtx!==ctx)return;if(r.status===410||j.cleared){ctx.messages=[];ctx.cleared=true;ctx.ownerLive=false;const input=document.querySelector("#publicFanChat .faninput");if(input)input.innerHTML='<p class="muted">This private session was cleared. Close this window to start another chat.</p>';renderPublicFanMsgs();return}if(r.ok&&Array.isArray(j.messages)){ctx.messages=j.messages;ctx.ownerLive=j.ownerLive===true;ctx.ownerLiveUntil=j.ownerLiveUntil||"";renderPublicFanMsgs()}}catch(_){}}

async function publicFanSend(){

function pickMine(candidates=myPersonas){
  if(!candidates.length)return Promise.resolve(null);
  if(candidates.length===1)return Promise.resolve(candidates[0].id);
  return new Promise(resolve=>{
    const o=document.createElement("div");o.className="overlay";
    o.innerHTML=`<div class="gate" style="max-width:420px;text-align:left">
      <h2 style="margin-bottom:4px">Act as…</h2>
      <p class="muted" style="margin-bottom:12px">Which of your personas should do this?</p>
      <div style="display:flex;flex-direction:column;gap:8px;max-height:52vh;overflow:auto">
        ${candidates.map(m=>`<button class="btn sec" data-id="${esc(m.id)}" style="display:flex;align-items:center;gap:10px;justify-content:flex-start;text-align:left;padding:8px 12px">
          <span style="width:30px;height:30px;flex:0 0 30px;border-radius:50%;background:#e4e6eb center/cover;${safeBgStyle(m.avatar_url)}"></span>
          <span><b>${esc(m.name)}</b> <span class="muted" style="font-size:12px">@${esc(m.handle)}</span></span></button>`).join("")}
      </div>
      <div style="margin-top:14px;text-align:right"><button class="btn sec sm" data-cancel="1">Cancel</button></div>
    </div>`;
    const done=v=>{o.remove();resolve(v);};
    o.addEventListener("click",e=>{
      if(e.target===o||e.target.closest("[data-cancel]")){done(null);return;}
      const b=e.target.closest("[data-id]");
      if(b)done(b.getAttribute("data-id"));
    });
    document.body.appendChild(o);
  });
}

async function discoveryKnew(id){

    const r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/split-post",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token},body:JSON.stringify({questionId:id})});
    const j=await r.json().catch(()=>({}));

    const n=(j.drafts||[]).filter(d=>d.ok).length;
    toast(`Saved to knowledge · created ${n} draft${n===1?"":"s"} — review in the Matrix queue`);

  }catch(e){discoveryBusy.delete(id);toast("Draft failed — try again");renderDiscoveryInbox()}

async function contextApi(action,payload,accessToken=session?.access_token){
  if(!accessToken)throw Object.assign(new Error("Sign in again before saving persona context."),{status:401});
  let response;
  try{response=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/ai-proxy",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+accessToken},body:JSON.stringify({action,...payload})})}
  catch(e){throw Object.assign(new Error("The secure context service could not be reached. Nothing in the context box was overwritten."),{status:0})}
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw Object.assign(new Error(result.error||("Context service HTTP "+response.status)),{status:response.status,code:result.code||""});
  return result;
}

function samePersonaValue(a,b){
  if(Array.isArray(a)||Array.isArray(b))return JSON.stringify(a||[])===JSON.stringify(b||[]);
  if(a&&typeof a==="object"||b&&typeof b==="object"){const stable=value=>Object.fromEntries(Object.keys(value||{}).sort().map(key=>[key,value[key]]));return JSON.stringify(stable(a))===JSON.stringify(stable(b))}
  if(typeof a==="boolean"||typeof b==="boolean")return !!a===!!b;
  return String(a??"").trim()===String(b??"").trim();
}

function mailboxAccounts(){
  return myAccounts.filter(a=>LEDGER_EMAIL_PROVIDERS.has(a.provider));
}
function mailboxSafeId(value){
  const id=String(value||"");
  return /^[A-Za-z0-9_-]{1,128}$/.test(id)?id:"";
}
function mailboxConnection(account){
  return account?myAccountConnections.find(c=>c.ledger_id===account.id&&c.provider===account.provider)||null:null;
}
function mailboxScopes(account){
  const scopes=mailboxConnection(account)?.granted_scopes;
  return Array.isArray(scopes)?scopes.map(scope=>String(scope).toLowerCase()):[];
}
function mailboxGmailCanScan(account){
  const connection=mailboxConnection(account),scopes=mailboxScopes(account);
  return account?.provider==="gmail"&&connection?.connection_state==="connected"&&(scopes.includes(GMAIL_READ_SCOPE)||scopes.includes(GMAIL_MODIFY_SCOPE));
}
function mailboxGmailCanModify(account){
  return mailboxGmailCanScan(account)&&mailboxScopes(account).includes(GMAIL_MODIFY_SCOPE);
}
function mailboxHasLoginEmail(account){
  return /^[^@\s]+@[^@\s]+\.[^@\s]+$/.test(String(account?.login_email||"").trim());
}
function mailboxAccountName(account){
  const provider=(PLATS[account?.provider]||{}).name||account?.provider||"Mailbox";
  return `${provider}${account?.login_email?" · "+account.login_email:account?.username?" · "+account.username:""}`;
}
function mailboxSelectedAccount(){
  const accounts=mailboxAccounts();
  if(!accounts.length){mailboxState.ledgerId="";return null}
  let selected=accounts.find(a=>a.id===mailboxState.ledgerId);
  if(!selected){
    selected=accounts.find(a=>mailboxGmailCanScan(a))||accounts[0];
    mailboxState.ledgerId=selected.id;
  }
  return selected;
}
function mailboxProviderNotice(account){
  if(!account)return `<div class="mailboxnotice warn"><b>Add a mailbox first</b>Open Accounts, add the mailbox address to your private ledger, then return here. Do not enter a password or app password.</div>`;
  const connection=mailboxConnection(account);
  if(account.provider==="gmail"){
    if(!mailboxHasLoginEmail(account))return `<div class="mailboxnotice warn"><b>Add the Gmail address first</b>This saved row has no usable login email, so Google cannot verify which mailbox to connect. Open Accounts, edit this entry, and save its full email address.<div class="mailboxbar" style="margin-top:8px"><button class="btn sm" onclick="switchAcctTab('accounts')">Edit account details</button></div></div>`;
    if(!mailboxGmailCanScan(account))return `<div class="mailboxnotice warn"><b>Connect this Gmail account</b>Google signs you in on its own page. MyPersonas never receives your Google password. The connector can inventory mail, but it cannot send messages or permanently delete them.<div class="mailboxbar" style="margin-top:8px"><button class="btn sm" onclick="connectGmail('${mailboxSafeId(account.id)}')">Connect Gmail</button></div></div>`;
    if(mailboxGmailCanModify(account))return `<div class="mailboxnotice"><b>Gmail cleanup access is ready</b>Reports can scan all selected folders. Labels, archive, and trash happen only after you review an exact action plan and approve it.</div>`;
    return `<div class="mailboxnotice warn"><b>Gmail reports are ready; cleanup is read-only</b>You can scan and review findings now. Approve Gmail cleanup access before labels, archive, or trash can run.<div class="mailboxbar" style="margin-top:8px"><button class="btn sm" onclick="connectGmail('${mailboxSafeId(account.id)}')">Enable cleanup access</button><button class="btn sm sec" onclick="disconnectGmail('${mailboxSafeId(account.id)}')">Disconnect Gmail</button></div></div>`;
  }
  const messages={
    outlook:["Microsoft connector not installed","Outlook cleanup needs a registered Microsoft app and delegated Microsoft Graph mailbox permissions. The official connector is not installed yet, so no scan or action buttons are shown."],
    yahoo:["Secure Yahoo worker not installed","Yahoo cleanup needs a separately reviewed, encrypted IMAP/app-password worker. Never paste a Yahoo password or app password into this site."],
    icloud:["Secure iCloud worker not installed","iCloud Mail cleanup needs an encrypted IMAP app-password worker. Never paste an Apple Account password or app-specific password into this site."],
    proton:["Local Proton Bridge required","Proton mailbox access must run through Proton Bridge on a trusted local computer and a future companion service. A hosted site cannot directly authorize this inbox."]
  };
  const copy=messages[account.provider]||["Mailbox connector not installed","This account remains a private planning record. No mailbox scan or cleanup action is available for this provider."];
  const state=connection?.connection_state==="connected"?" A recorded connection exists, but it is not an installed Inbox Concierge connector.":"";
  return `<div class="mailboxnotice stop"><b>${esc(copy[0])}</b>${esc(copy[1]+state)}</div>`;
}
function mailboxPanelHtml(){
  const accounts=mailboxAccounts(),account=mailboxSelectedAccount();

    else if(mailboxState.loaded)body=mailboxDashboardHtml(account);

function mailboxChooseAccount(id){

  if(mailboxPollTimer){clearTimeout(mailboxPollTimer);mailboxPollTimer=null}
  mailboxState={ledgerId:account?.id||"",loaded:false,loading:false,error:"",data:null};
  mailboxView="subscriptions";mailboxRender();
  if(account?.provider==="gmail"&&mailboxGmailCanScan(account))mailboxLoad();

async function mailboxCall(action,payload={}){
  const{data}=await sb.auth.getSession(),active=data&&data.session;
  if(!active)throw new Error("Sign in again before managing this inbox.");
  let response;
  try{
    response=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/mailbox-manager",{
      method:"POST",
      headers:{"Content-Type":"application/json","Authorization":"Bearer "+active.access_token},
      body:JSON.stringify({action,...payload})
    });
  }catch(e){throw new Error("Could not reach the inbox service. "+(e.message||e))}
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw new Error(result.error||result.message||`Inbox service failed (HTTP ${response.status}).`);
  return result;
}
function mailboxEnsureLoaded(){
  const account=mailboxSelectedAccount();mailboxRender();
  if(account?.provider==="gmail"&&mailboxGmailCanScan(account)&&!mailboxState.loaded&&!mailboxState.loading)mailboxLoad();
}
async function mailboxLoad(quiet=false){
  const account=mailboxSelectedAccount();
  if(!account||account.provider!=="gmail"||!mailboxGmailCanScan(account))return;
  const request=++mailboxRequest,ledgerId=account.id;
  mailboxState={...mailboxState,ledgerId,loading:true,error:""};
  if(!quiet)mailboxRender();
  try{
    const data=await mailboxCall("dashboard",{ledgerId});
    if(request!==mailboxRequest||mailboxState.ledgerId!==ledgerId)return;
    mailboxState={ledgerId,loaded:true,loading:false,error:"",data};
    mailboxRender();mailboxSchedulePoll();
  }catch(e){
    if(request!==mailboxRequest||mailboxState.ledgerId!==ledgerId)return;
    mailboxState={...mailboxState,loaded:!!mailboxState.data,loading:false,error:e.message||String(e)};
    mailboxRender();if(mailboxHasActiveWork())mailboxSchedulePoll(10000);
  }
}
function mailboxRefresh(){
  mailboxLoad(!!mailboxState.loaded);
}
function mailboxArray(value){return Array.isArray(value)?value:[]}
function mailboxValue(object,...keys){
  for(const key of keys)if(object&&object[key]!==undefined&&object[key]!==null)return object[key];
  return null;
}
function mailboxSettings(){

}
function mailboxInboxPaused(){

function mailboxFindings(){

  });
}
function mailboxProtected(finding){
  const reasons=mailboxValue(finding,"protectedReasons","protected_reasons"),category=String(mailboxValue(finding,"category","kind")||"").toLowerCase();
  return mailboxValue(finding,"protected","isProtected","is_protected")===true||(Array.isArray(reasons)&&reasons.length>0)||["security","order_travel","financial_legal_medical","personal"].includes(category)||["spam","trash"].includes(String(mailboxValue(finding,"sourceFolder","source_folder","folder")||"").toLowerCase());
}
function mailboxCategory(finding){
  if(mailboxProtected(finding))return "protected";
  const raw=String(mailboxValue(finding,"category","kind")||"other").toLowerCase().replace(/[\s-]+/g,"_");
  if(["subscription","subscriptions","newsletter","newsletters"].includes(raw))return "subscriptions";
  if(["account","accounts","account_creation","account_creations","signup","welcome"].includes(raw))return "accounts";
  if(["receipt","receipts","invoice","invoices","order","orders"].includes(raw))return "receipts";

}
function mailboxSummary(){
  const reported=mailboxState.data?.summary||{},counts={subscriptions:0,accounts:0,receipts:0,protected:0,other:0};
  mailboxFindings().forEach(f=>counts[mailboxCategory(f)]++);
  for(const key of Object.keys(counts)){
    const aliases=key==="accounts"?["accounts","accountCreations","account_creations"]:key==="protected"?["protected","protectedCount","protected_count"]:[key];
    const value=mailboxValue(reported,...aliases);
    if(Number.isFinite(Number(value)))counts[key]=Number(value);
  }

}
function mailboxDate(value){
  if(!value)return "";

}
function mailboxRunActive(value){

function mailboxHasActiveWork(){

  return mailboxArray(data.actionPlans||data.action_plans).some(plan=>mailboxRunActive(mailboxValue(plan,"status","state"))||mailboxRunActive(mailboxValue(plan,"undoStatus","undo_status")));
}

  if(!validLedgerUrl(url)){toast("Account URLs must use credential-free HTTPS without a query or fragment");return}

async function saveLedgerBatch(){
  if(ledgerBatchSaving)return;
  const rows=[...document.querySelectorAll("#ledgerBatch .ledgerrow")];
  if(!rows.length){toast("Add at least one account row");return}
  const items=rows.map(r=>({row:r,ledger_id:r.dataset.ledgerId||"",provider:r.querySelector(".lrProvider").value,username:r.querySelector(".lrUser").value.trim(),
    login_email:normalizeLedgerEmail(r.querySelector(".lrEmail").value),persona_id:r.querySelector(".lrPersona").value,url:r.querySelector(".lrUrl").value.trim(),
    notes:r.querySelector(".lrNotes").value.trim(),newName:r.querySelector(".lrNewName").value.trim(),newHandle:r.querySelector(".lrNewHandle").value.trim().toLowerCase()}));
  const seen=[],selectedIds=new Set();
  for(const x of items){
    if(!x.username&&!x.login_email&&!x.url){toast("Each row needs a username, login email, or account URL");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    if(!validLedgerEmail(x.login_email)){toast("Enter a valid login email");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    if(!validLedgerUrl(x.url)){toast("Account URLs must use credential-free HTTPS without a query or fragment");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    if(x.persona_id==="__new__"&&(!x.newName||!/^[a-z0-9._]{3,30}$/.test(x.newHandle))){toast("Quick personas need a name and a valid 3–30 character lowercase handle");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    const selected=x.ledger_id?myAccounts.find(a=>a.id===x.ledger_id):null;
    if(x.ledger_id&&(!selected||selected.provider!==x.provider)){toast("A saved account selection is no longer available. Choose it again.");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    if(selectedIds.has(x.ledger_id)&&x.ledger_id){toast("The same saved account is selected more than once");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    if(x.ledger_id)selectedIds.add(x.ledger_id);
    if(selected&&ledgerUsernameLocked(selected)&&normalizeLedgerUsername(x.username)!==normalizeLedgerUsername(selected.username)){toast(`Disconnect or reset ${(PLATS[selected.provider]||{}).name||selected.provider} before changing the protected username`);x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    if(selected&&ledgerEmailLocked(selected)&&normalizeLedgerEmail(x.login_email)!==normalizeLedgerEmail(selected.login_email)){toast("Disconnect Gmail before changing the authenticated login email");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    const duplicate=myAccounts.find(a=>a.id!==x.ledger_id&&sameLedgerAccount(a,x));
    if(duplicate){toast("That account is already recorded. Choose it from Saved account to update it.");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    if(seen.some(y=>sameLedgerAccount(y,x))){toast("The same account appears more than once in this batch");x.row.scrollIntoView({behavior:"smooth",block:"center"});return}
    seen.push(x);
  }
  if(!await requireAal2ForSensitiveAction("change this account inventory"))return;
  ledgerBatchSaving=true;const saveButton=document.getElementById("ledgerBatchSaveBtn");if(saveButton){saveButton.disabled=true;saveButton.textContent="Saving…"}
  const made=new Map();let added=0,updated=0;
  try{
    for(const x of items){
      let pid=x.persona_id||null;
      if(pid==="__new__"){
        pid=made.get(x.newHandle)||null;
        if(!pid){
          const{data,error}=await createPrivatePersona(x.newName,x.newHandle);
          if(error){toast("Persona @"+x.newHandle+": "+(error.message.includes("duplicate")?"handle already exists":error.message));return}
          pid=data.id;made.set(x.newHandle,pid);
        }
      }
      const selected=x.ledger_id?myAccounts.find(a=>a.id===x.ledger_id):null;
      const{error}=await sb.rpc("save_account_ledger_entry",{p_ledger_id:x.ledger_id||null,p_persona_id:pid,p_provider:x.provider,p_username:x.username,p_login_email:x.login_email,p_url:x.url,p_notes:x.notes,p_aliases:selected?.aliases||"",p_suspended:!!selected?.suspended,p_is_primary:!!selected?.is_primary});
      if(error){toast("Added "+added+" and updated "+updated+"; stopped: "+error.message);await loadMine();renderStudio();return}
      if(x.ledger_id)updated++;else added++;
    }
    await loadMine();if(myAccounts.some(account=>account.provider==="twitter")&&!twitterOAuthCapability.loaded)await loadTwitterCapability();if(myAccounts.some(account=>account.provider==="reddit")&&!redditOAuthCapability.loaded)await loadRedditCapability();if(myAccounts.some(account=>account.provider==="youtube")&&!youtubeOAuthCapability.loaded)await loadYouTubeCapability();if(myAccounts.some(account=>account.provider==="tiktok")&&!tiktokOAuthCapability.loaded)await loadTikTokCapability();if(myAccounts.some(account=>account.provider==="discord")&&!discordOAuthCapability.loaded)await loadDiscordCapability();if(myAccounts.some(account=>account.provider==="twitch")&&!twitchOAuthCapability.loaded)await loadTwitchCapability();if(myAccounts.some(account=>account.provider==="patreon")&&!patreonOAuthCapability.loaded)await loadPatreonCapability();if(myAccounts.some(account=>account.provider==="facebook"||account.provider==="instagram")&&!metaOAuthCapability.loaded)await loadMetaCapability();acctTab="accounts";renderStudio();
    const parts=[];if(added)parts.push("added "+added);if(updated)parts.push("updated "+updated);toast("Accounts saved: "+parts.join(" and ")+". No external access was granted.");
  }finally{
    ledgerBatchSaving=false;const currentButton=document.getElementById("ledgerBatchSaveBtn");if(currentButton){currentButton.disabled=false;currentButton.textContent="Save accounts"}
  }
}

async function gmailOAuthAction(action,id,extra={}){
  const{data}=await sb.auth.getSession(),s=data&&data.session;
  if(!s)return{error:"Sign in again before connecting Gmail."};
  try{
    const r=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/gmail-oauth",{
      method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token},
      body:JSON.stringify(Object.assign({action,ledgerId:id},extra))});
    const j=await r.json().catch(()=>({}));
    return r.ok?{data:j}:{error:j.error||("Gmail authorization failed (HTTP "+r.status+")")};
  }catch(e){return{error:"Could not reach Gmail authorization: "+(e.message||e)}}
}
async function connectGmail(id){
  toast("Opening Google authorization…");
  const result=await gmailOAuthAction("start",id);
  if(result.error){toast(result.error);return}
  try{
    const destination=new URL(result.data.authorizationUrl);
    if(destination.origin!=="https://accounts.google.com")throw new Error("Unexpected authorization destination");
    const state=destination.searchParams.get("state")||"",browserNonce=result.data.browserNonce||"";
    if(!/^[A-Za-z0-9_-]{32,200}$/.test(state)||!/^[A-Za-z0-9_-]{32,200}$/.test(browserNonce))throw new Error("Invalid Gmail authorization binding");
    sessionStorage.setItem("gmail_oauth_"+state,browserNonce);
    sessionStorage.setItem("gmail_oauth_tab_"+state,acctTab==="inbox"?"inbox":"accounts");
    location.assign(destination.toString());
  }catch(e){toast(e.message||"Invalid Google authorization link")}
}
async function finishPendingGmail(expectedUid=session?.user?.id||null,generation=authLoadGeneration){
  if(!gmailOAuthPending||gmailOAuthCompleting)return;
  if(!expectedUid||session?.user?.id!==expectedUid||generation!==authLoadGeneration)return;
  const pending=gmailOAuthPending;gmailOAuthPending=null;
  gmailOAuthCompleting=true;
  const result=await gmailOAuthAction("complete",null,pending);
  gmailOAuthCompleting=false;
  if(session?.user?.id!==expectedUid||generation!==authLoadGeneration)return;
  const gmailNoticeMessage=result.error||"Gmail connected. Inbox reports and owner-approved cleanup are available; sending and permanent deletion remain unavailable.";
  gmailOAuthNotice={message:gmailNoticeMessage,returnTab:pending.returnTab};
  await loadMine(expectedUid,generation);
  if(session?.user?.id!==expectedUid||generation!==authLoadGeneration)return;
  // finishPendingGmail resolves AFTER the initial studio route() has already run,
  // so the notice-toast in route() would not fire until the next navigation —
  // making Gmail connect outcomes (success or failure) look silent. Surface it now.
  acctTab=pending.returnTab==="inbox"?"inbox":"accounts";
  gmailOAuthNotice=null;
  renderStudio();
  toast(gmailNoticeMessage);
}

async function connectTwitter(id,enablePosting=false){
  const account=myAccounts.find(a=>a.id===id);

  if(!normalizeLedgerUsername(account.username)){toast("Add the exact X username before connecting");return}
  if(!twitterOAuthCapability.loaded)await loadTwitterCapability();
  if(!twitterOAuthCapability.configured){toast(twitterOAuthCapability.error||"X still needs its developer Web App credentials and API access before accounts can connect.");return}
  toast(enablePosting?"Opening X authorization for posting access…":"Opening X authorization…");
  const result=await twitterOAuthAction("start",id,enablePosting?{enablePosting:true}:{});
  if(result.error){toast(result.error);return}
  try{
    const destination=new URL(result.data.authorizationUrl);
    if(!["https://x.com","https://twitter.com"].includes(destination.origin)||destination.pathname!=="/i/oauth2/authorize")throw new Error("Unexpected X authorization destination");
    const state=destination.searchParams.get("state")||"",browserNonce=result.data.browserNonce||"";
    if(!/^[A-Za-z0-9_-]{32,200}$/.test(state)||!/^[A-Za-z0-9_-]{32,200}$/.test(browserNonce))throw new Error("Invalid X authorization binding");
    sessionStorage.setItem("twitter_oauth_"+state,JSON.stringify({browserNonce,enablePosting}));
    location.assign(destination.toString());
  }catch(e){toast(e.message||"Invalid X authorization link")}
}

    <div class="autoformactions">${editable?`<button class="btn sm sec" onclick="composerSave('${d.id}')">Save edits</button><button class="btn sm" id="cmpSchedule_${d.id}" onclick="composerPreviewSchedule('${d.id}')">Preview &amp; schedule</button>`:""}${scheduled?`<button class="btn sm sec" onclick="composerUnschedule('${d.id}')">Unschedule to edit</button>`:""}${canRetryMeta?`<button class="btn sm" id="cmpPublish_${d.id}" onclick="composerPreviewPublish('${d.id}')">${hasResults?"Preview retry":"Preview &amp; publish now"}</button>`:""}${editable?`<button class="btn sm danger" onclick="composerDelete('${d.id}')">Delete</button>`:""}${terminal?`<span class="muted">${d.status==="publishing"?"Publishing is in progress or awaiting reconciliation; controls are locked.":"Publishing history is read-only."}</span>`:""}</div>
  </div>`;
}
async function composerSave(id,quiet=false,refresh=true){
  const edits=composerEdits(id);if(!edits)return false;composerPreviewProofs.delete(id);
  const{data,error}=await sb.rpc("save_post_draft",{p_draft_id:id,p_fb_caption:edits.fb,p_ig_caption:edits.ig,p_x_caption:edits.x,p_targets:edits.targets});
  if(error||!data){toast(error?.message||"The draft changed; reload and try again");if(refresh)composerRefresh();return false}if(!quiet)toast("Draft saved; approval is cleared");if(refresh)composerRefresh();return true;
}
function composerMediaUrl(d,target){return String(target==="facebook"?(d.fb_image_url||d.source_image_url||""):target==="instagram"?(d.ig_image_url||d.source_image_url||""):(d.x_image_url||d.source_image_url||""))}
async function composerPreviewBinding(d,targets){
  if(!targets.some(target=>target==="facebook"||target==="instagram"))return{facebookPageId:"",instagramBusinessId:"",facebookName:"",instagramName:""};
  const{data,error}=await sb.from("meta_page_connections").select("facebook_page_id,facebook_page_name,instagram_business_id,instagram_username").eq("facebook_ledger_id",d.facebook_ledger_id).maybeSingle();
  if(error||!data)throw new Error("The exact Meta Page pairing could not be loaded. Reconnect or refresh before previewing.");if(targets.includes("facebook")&&!data.facebook_page_id)throw new Error("The selected Facebook Page has no exact provider target.");if(targets.includes("instagram")&&!data.instagram_business_id)throw new Error("The selected Page has no linked professional Instagram target.");return{facebookPageId:String(data.facebook_page_id||""),instagramBusinessId:String(data.instagram_business_id||""),facebookName:String(data.facebook_page_name||""),instagramName:String(data.instagram_username||"")};
}
function composerPreviewKey(id,d,edits,scheduledFor,zone,binding,mode){return JSON.stringify({version:PLATFORM_PREVIEW_VERSION,mode,id,personaId:d.persona_id||"",facebookLedgerId:d.facebook_ledger_id||"",facebookPageId:binding.facebookPageId||"",instagramBusinessId:binding.instagramBusinessId||"",targets:[...edits.targets].sort(),scheduledFor:scheduledFor||"",zone:zone||"",facebook:{caption:edits.fb,image:composerMediaUrl(d,"facebook")},instagram:{caption:edits.ig,image:composerMediaUrl(d,"instagram")},twitter:{caption:edits.x,image:composerMediaUrl(d,"twitter")}})}
function composerPreviewItems(d,edits,scheduledFor,zone,binding,mode){
  const page=(myAccounts||[]).find(a=>a.id===d.facebook_ledger_id),persona=((myPersonas||[]).find(p=>p.id===d.persona_id)||{}).name||"Persona";return edits.targets.map(provider=>({provider,account:provider==="facebook"?(binding.facebookName||page?.username||page?.login_email||"Facebook Page"):provider==="instagram"?(binding.instagramName?`@${binding.instagramName.replace(/^@/,"")}`:`${persona} · linked Instagram`):(page?.username||persona),accountId:provider==="facebook"?binding.facebookPageId:provider==="instagram"?binding.instagramBusinessId:(page?.id||""),text:provider==="facebook"?edits.fb:provider==="instagram"?edits.ig:edits.x,mediaUrl:composerMediaUrl(d,provider),mediaKind:"image",scheduledFor:scheduledFor||null,timezone:zone,mode}));
}
async function composerPreviewSchedule(id){
  const d=composerDraftRows.get(id),edits=composerEdits(id);if(!d||!edits)return;if(edits.targets.includes("twitter")){toast("X scheduling stays locked until its versioned writer and write permission are verified.");return}if(!edits.targets.some(t=>t==="facebook"||t==="instagram")){toast("Choose Facebook or Instagram");return}const wall=val("cmpAt_"+id),zone=autoTz(),scheduledFor=zonedInputToIso(wall,zone);if(!scheduledFor){toast(`That wall-clock time does not exist in ${zone} because of a daylight-saving change`);return}if(Date.parse(scheduledFor)<=Date.now()){toast("Choose a future publish time");return}
  try{const binding=await composerPreviewBinding(d,edits.targets),key=composerPreviewKey(id,d,edits,scheduledFor,zone,binding,"Scheduled post");openPlatformPreviewDialog({title:"Review every scheduled platform preview",intro:`These exact variants are proposed for ${autoTaskDate(scheduledFor,zone)}. Nothing is scheduled until you approve below.`,items:composerPreviewItems(d,edits,scheduledFor,zone,binding,"Scheduled post"),confirmLabel:"Approve previews & schedule",onConfirm:()=>{composerPreviewProofs.set(id,{mode:"schedule",key,scheduledFor,zone,facebookPageId:binding.facebookPageId,instagramBusinessId:binding.instagramBusinessId});return composerSchedule(id)}})}catch(error){toast(error.message||"Exact targets could not be previewed")}
}
async function composerPreviewPublish(id){
  const d=composerDraftRows.get(id),edits=composerEdits(id);if(!d||!edits)return;if(edits.targets.includes("twitter")){toast("X publishing stays locked until its versioned writer and write permission are verified.");return}if(!edits.targets.some(t=>t==="facebook"||t==="instagram")){toast("Choose Facebook or Instagram");return}
  try{const binding=await composerPreviewBinding(d,edits.targets),key=composerPreviewKey(id,d,edits,"",autoTz(),binding,"Publish immediately");openPlatformPreviewDialog({title:"Review before publishing now",intro:"Approving here calls the selected platform immediately. Check every account, caption, media source, framing, safe-area guide, and timing.",items:composerPreviewItems(d,edits,null,autoTz(),binding,"Publish immediately"),confirmLabel:"Approve previews & publish now",onConfirm:()=>{composerPreviewProofs.set(id,{mode:"publish",key,facebookPageId:binding.facebookPageId,instagramBusinessId:binding.instagramBusinessId});return composerPublish(id)}})}catch(error){toast(error.message||"Exact targets could not be previewed")}
}
async function composerSchedule(id){
  const d=composerDraftRows.get(id),edits=composerEdits(id),proof=composerPreviewProofs.get(id);if(!d||!edits)return;if(edits.targets.includes("twitter")){toast("X scheduling is not wired yet. Uncheck X; its caption stays saved for later.");return}if(!edits.targets.some(t=>t==="facebook"||t==="instagram")){toast("Choose Facebook or Instagram for this Meta-only schedule");return}
  const wall=val("cmpAt_"+id),zone=autoTz(),scheduledFor=zonedInputToIso(wall,zone);if(!scheduledFor){toast(`That wall-clock time does not exist in ${zone} because of a daylight-saving change`);return}if(Date.parse(scheduledFor)<=Date.now()){toast("Choose a future publish time");return}
  let binding;try{binding=await composerPreviewBinding(d,edits.targets)}catch(error){toast(error.message);return}const currentKey=composerPreviewKey(id,d,edits,scheduledFor,zone,binding,"Scheduled post");if(!proof||proof.mode!=="schedule"||proof.key!==currentKey){composerPreviewProofs.delete(id);toast("Open and approve the current platform previews before scheduling.");return}composerPreviewProofs.delete(id);
  const button=document.getElementById("cmpSchedule_"+id),owner=session?.user?.id;if(button){button.disabled=true;button.textContent="Staging exact media…"}
  try{
    const{data:{session:active}}=await sb.auth.getSession();if(!owner||!active||active.user.id!==owner){toast("Your signed-in account changed; nothing was scheduled");return}
    const response=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/approve-post-draft",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+active.access_token},body:JSON.stringify({action:"prepare-schedule",draftId:id,scheduledFor,timezone:zone,fbCaption:edits.fb,igCaption:edits.ig,xCaption:edits.x,targets:edits.targets})}),result=await response.json().catch(()=>({}));
    if(session?.user?.id!==owner)return;if(!response.ok||!result.receipt){toast(result.error||`The immutable server preview could not be created (HTTP ${response.status})`);return}let exact;try{exact=exactOwnerPreviewReceipt(result.receipt,{version:"post-draft-schedule-preview-v1",draftId:id,actions:["post_draft.schedule"]})}catch(error){toast(error.message);return}
    openPlatformPreviewDialog({title:"Server preview · immutable staged media",intro:"The server staged the exact media bytes, resolved the exact Meta account targets, and rebuilt the exact schedule. Confirming this view records a separate AAL2 acknowledgement; it still does not schedule.",items:exact.items,confirmLabel:"Acknowledge exact staged preview",onConfirm:async()=>{
      if(!await requireAal2ForSensitiveAction("acknowledge this exact Meta schedule"))return;const acknowledgedResult=await sb.rpc("acknowledge_post_draft_schedule_preview_receipt",{p_receipt_id:exact.id,p_draft_id:id});if(acknowledgedResult.error){toast(acknowledgedResult.error.message);return}const acknowledgedRaw=Array.isArray(acknowledgedResult.data)?acknowledgedResult.data[0]:acknowledgedResult.data;let acknowledged;try{acknowledged=exactOwnerPreviewReceipt(acknowledgedRaw,{version:"post-draft-schedule-preview-v1",draftId:id,actions:["post_draft.schedule"],requireAcknowledged:true})}catch(error){toast(error.message);return}
      openPlatformPreviewDialog({title:"Acknowledged · schedule exact Meta posts",intro:"This final confirmation consumes the acknowledged receipt once and schedules only the exact server-staged media, captions, targets, and time shown below.",items:acknowledged.items,confirmLabel:"Consume receipt & schedule",onConfirm:()=>composerCommitSchedule(id,acknowledged.id)});
    }});
  }catch(error){toast("The approval service could not be reached. Nothing was scheduled; request a fresh preview.")}finally{if(button?.isConnected){button.disabled=false;button.textContent="Preview & schedule"}}
}
async function composerCommitSchedule(id,receiptId){
  const owner=session?.user?.id,button=document.getElementById("cmpSchedule_"+id);if(!owner)return;if(button){button.disabled=true;button.textContent="Scheduling…"}
  try{const{data:{session:active}}=await sb.auth.getSession();if(!active||active.user.id!==owner){toast("Your signed-in account changed; nothing was scheduled");return}const response=await fetch(CONFIG.SUPABASE_URL.replace(/\/$/,"")+"/functions/v1/approve-post-draft",{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+active.access_token},body:JSON.stringify({action:"commit-schedule",draftId:id,receiptId})}),result=await response.json().catch(()=>({}));if(session?.user?.id!==owner)return;if(!response.ok||!result.draft){toast(result.error||`The acknowledged schedule could not be committed (HTTP ${response.status})`);return}toast("Exact preview receipt consumed; scheduled while the background publisher remains dormant")}catch(error){toast("The commit response was lost. Reload before attempting anything else; the one-shot receipt prevents a duplicate commit.")}finally{if(session?.user?.id===owner)composerRefresh()}
}
async function composerUnschedule(id){
  composerPreviewProofs.delete(id);if(!confirm("Unschedule this draft and clear its approval?"))return;const{data,error}=await sb.rpc("unschedule_post_draft",{p_draft_id:id});toast(error?error.message:data?"Unscheduled; edit and approve it again":"The draft changed; reloading");composerRefresh();
}
async function composerPublish(id){
  const d=composerDraftRows.get(id),edits=composerEdits(id),proof=composerPreviewProofs.get(id);if(!d||!edits)return;const targets=edits.targets;if(targets.includes("twitter")){toast("X publishing is not wired yet. Uncheck X before publishing the Meta variants; its caption remains saved.");return}if(!targets.some(t=>t==="facebook"||t==="instagram")){toast("Choose Facebook or Instagram");return}let binding;try{binding=await composerPreviewBinding(d,targets)}catch(error){toast(error.message);return}const currentKey=composerPreviewKey(id,d,edits,"",autoTz(),binding,"Publish immediately");if(!proof||proof.mode!=="publish"||proof.key!==currentKey){composerPreviewProofs.delete(id);toast("Open and approve the current platform previews before publishing.");return}composerPreviewProofs.delete(id);
  const btn=document.getElementById("cmpPublish_"+id);if(btn){btn.disabled=true;btn.textContent="Preparing server preview…"}
  try{
    const current=await sb.from("post_drafts").select("fb_post_id,ig_media_id,x_tweet_id").eq("id",id).maybeSingle();if(current.error||!current.data){toast("Draft not found; reload and try again");return}if(!current.data.fb_post_id&&!current.data.ig_media_id&&!current.data.x_tweet_id&&!await composerSave(id,true,false))return;
    const owner=session?.user?.id;if(!owner){toast("Your signed-in account changed; nothing was published");return}const prepared=await providerPostAction("meta-post",{action:"prepare-publish-draft",draftId:id});if(session?.user?.id!==owner)return;if(prepared.error){toast(prepared.error);return}
    openImmediateReceiptPreview({receipt:prepared.data?.receipt,expected:{draftId:id,provider:"meta",action:"meta.publish_now"},title:"Final server preview · Meta",intro:"The server resolved the current Facebook Page and linked Instagram target, pinned immutable media bytes, and rebuilt the exact pending provider actions. Confirm this second preview to consume the one-shot receipt and publish immediately.",confirmLabel:"Confirm server preview & publish now",onConfirm:receiptId=>composerExecutePreparedPublish(id,receiptId)});
  }catch(e){toast("The server preview service could not be reached. Nothing was published.")}finally{if(btn?.isConnected){btn.disabled=false;btn.textContent=d.fb_post_id||d.ig_media_id?"Preview retry":"Preview & publish now"}}
}
async function composerExecutePreparedPublish(id,receiptId){
  const owner=session?.user?.id,btn=document.getElementById("cmpPublish_"+id);if(!owner)return;if(btn){btn.disabled=true;btn.textContent="Publishing…"}
  try{const sent=await providerPostAction("meta-post",{action:"publish-draft",draftId:id,receiptId});if(session?.user?.id!==owner)return;if(sent.error){toast(sent.details?.reconciliationRequired?"A provider result is uncertain. Reconcile this locked draft before retrying.":sent.error);return}toast(sent.data?.status==="posted"?"Published and provider results saved":"Publish incomplete: "+(sent.data?.errors||[]).join(" | "))}catch(error){toast("The publish service could not be reached. Reload before deciding whether to retry.")}finally{composerRefresh()}
}
async function composerDelete(id){
  if(!confirm("Delete this unpublished draft?"))return;const{data,error}=await sb.rpc("delete_post_draft",{p_draft_id:id});toast(error?error.message:data?"Deleted":"The draft changed; reloading");composerRefresh();
}

async function renderTag(tag,epoch=++renderEpoch){
  setMeta("#"+tag+" — AliaSpaces","Posts across the network tagged #"+tag);
  app.innerHTML='<div class="empty">Loading…</div>';
  const state=netFeed=newNetFeed("tag",String(tag||"").slice(0,120),epoch),{data,error}=await netFeedQuery(state);
  if(epoch!==renderEpoch||netFeed!==state)return;
  const raw=data||[],posts=netFeedFilter(raw);raw.forEach(row=>state.seenIds.add(row.id));advanceDescendingCursor(state,raw);if(error||raw.length<FEED_PAGE)state.done=true;
  app.innerHTML=`<div style="display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:12px">
    <h3 class="secthead" style="margin:0">#${esc(tag)}</h3>
    <button class="btn sec sm" onclick="go('')">Back to discover</button></div>
    <div id="netFeed">${error?'<div class="empty">Tagged posts could not be loaded. Try again.</div>':posts.map(x=>postHtml(x,x.personas,false)).join("")||`<div class="empty">No public posts tagged #${esc(tag)} yet.</div>`}</div>
    ${state.done?"":'<div style="text-align:center;margin-top:16px"><button class="btn sec" id="feedMoreBtn" onclick="loadMoreNetFeed()">Load more posts</button></div>'}`;
}
