<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MyPersonas — every persona, one home</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f0f2f5;--panel:#fff;--border:#dddfe2;--text:#1c1e21;--dim:#65676b;--accent:#1877f2;--accent2:#166fe5;--red:#e41e3f;--green:#42b72a}
*{box-sizing:border-box;margin:0;padding:0}
body{background:var(--bg);color:var(--text);font-family:Segoe UI,Helvetica,Arial,sans-serif;font-size:15px;min-height:100vh}
body.custom-bg{background-size:cover!important;background-attachment:fixed!important;background-position:center!important}
body.app-bg{background:#f7fafd url('assets/bg.png') center top/cover fixed no-repeat}
header{display:flex;align-items:center;gap:14px;padding:10px 24px;background:#fff;position:sticky;top:0;z-index:50;box-shadow:0 1px 3px rgba(0,0,0,.12);flex-wrap:wrap}
header h1{font-size:24px;font-weight:800;color:var(--accent);cursor:pointer;white-space:nowrap;letter-spacing:-.5px}
#gsearch{max-width:280px;border-radius:50px;border:none;background:var(--bg);padding:10px 16px;font-size:15px}
nav{display:flex;gap:4px;flex:1;justify-content:flex-end;flex-wrap:wrap}
nav button{background:none;border:none;color:var(--dim);padding:10px 16px;border-radius:8px;cursor:pointer;font-weight:600;font-family:inherit;font-size:15px;position:relative}
nav button:hover{background:var(--bg);color:var(--text)}
.badge{position:absolute;top:2px;right:4px;background:var(--red);color:#fff;border-radius:50%;min-width:18px;height:18px;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:800}
main{padding:24px;max-width:1160px;margin:0 auto}
.btn{background:var(--accent);color:#fff;border:none;padding:10px 20px;border-radius:8px;cursor:pointer;font-size:15px;font-weight:600;font-family:inherit}
.btn:hover{background:var(--accent2)}
.btn.sec{background:#e4e6eb;color:var(--text)}
.btn.sec:hover{background:#d8dadf}
.btn.danger{background:#fff;color:var(--red);border:1px solid var(--red)}
.btn.sm{padding:6px 12px;font-size:13px}
.btn:disabled{opacity:.5;cursor:not-allowed}
.card{background:var(--panel);border-radius:12px;padding:20px;margin-bottom:16px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.card h3{color:var(--text);font-size:17px;font-weight:700;margin-bottom:10px}
.secthead{font-size:20px;font-weight:800;color:var(--text);margin:6px 0 14px}
.hero{position:relative;padding:0;overflow:hidden;min-height:420px;display:flex;align-items:center;justify-content:flex-end;background:#f4f9ff url('assets/hero.png') left center/cover no-repeat}
.hero .ht{max-width:480px;padding:48px 56px;text-align:left}
.hero h2{font-size:38px;font-weight:800;margin-bottom:12px;line-height:1.15;color:#0b2545}
.hero p{color:#3d5875;font-size:17px;margin-bottom:22px}
.feat3{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:16px;margin-bottom:20px}
@media(max-width:900px){.hero{justify-content:center;background-position:center}.hero .ht{background:rgba(255,255,255,.82);border-radius:12px;margin:24px;padding:28px}}
label{display:block;font-size:13px;color:var(--dim);margin:12px 0 4px;font-weight:600}
input,select,textarea{width:100%;background:#fff;border:1px solid #ccd0d5;border-radius:8px;color:var(--text);padding:10px 12px;font-size:15px;font-family:inherit}
textarea{resize:vertical;min-height:64px}
input:focus,select:focus,textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px rgba(24,119,242,.15)}
input:-webkit-autofill,input:-webkit-autofill:hover,input:-webkit-autofill:focus,
select:-webkit-autofill,textarea:-webkit-autofill{
  -webkit-box-shadow:0 0 0 1000px #fff inset!important;
  -webkit-text-fill-color:var(--text)!important;
  transition:background-color 99999s ease-in-out 0s}
input[type=checkbox]{width:auto}
.row{display:flex;gap:12px;flex-wrap:wrap}.row>*{flex:1;min-width:170px}
.muted{color:var(--dim);font-size:13px}
.pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}
.pcard{background:#fff;border-radius:12px;overflow:hidden;cursor:pointer;box-shadow:0 1px 2px rgba(0,0,0,.1);transition:box-shadow .15s}
.pcard:hover{box-shadow:0 4px 14px rgba(0,0,0,.15)}
.pcard .ph{height:92px;background:linear-gradient(120deg,var(--pc,#1877f2),#3b5998);background-size:cover;background-position:center}
.pcard .pb{padding:14px;position:relative}
.pcard .av{width:64px;height:64px;border-radius:50%;border:3px solid #fff;position:absolute;top:-36px;left:14px;background:#e4e6eb center/cover;box-shadow:0 1px 4px rgba(0,0,0,.2)}
.pcard b{display:block;margin-top:26px;font-size:17px;font-weight:700}
.pill{display:inline-block;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:700}
.pill.nsfw{background:#fde8ec;color:#c0294a}
.pill.priv{background:#e7f3ff;color:var(--accent)}
.pill.live{background:#e41e3f;color:#fff;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.6}}
.chip{display:inline-flex;align-items:center;gap:5px;background:var(--bg);border:1px solid var(--border);border-radius:50px;padding:6px 13px;font-size:13px;font-weight:600;margin:3px 4px 3px 0;text-decoration:none;color:var(--text)}
.chip:hover{border-color:var(--accent);color:var(--accent)}
.tag2{display:inline-block;background:#e7f3ff;border-radius:6px;padding:2px 8px;font-size:12px;margin:2px 3px 0 0;color:var(--accent);font-weight:600;cursor:pointer}
.banner{height:240px;border-radius:12px;background:linear-gradient(120deg,var(--pc,#1877f2),#3b5998) center/cover;box-shadow:0 1px 3px rgba(0,0,0,.15)}
.pp-head{display:flex;gap:18px;align-items:flex-end;margin-top:-52px;padding:0 28px;flex-wrap:wrap}
.pp-av{width:132px;height:132px;border-radius:50%;border:4px solid #fff;background:#e4e6eb center/cover;box-shadow:0 2px 8px rgba(0,0,0,.2)}
.pp-name{font-size:28px;font-weight:800;text-shadow:0 1px 2px rgba(255,255,255,.8)}
.cols{display:grid;grid-template-columns:320px 1fr;gap:18px;margin-top:18px}
@media(max-width:760px){.cols{grid-template-columns:1fr}}
.top8grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.t8{text-align:center;cursor:pointer;font-size:11px;font-weight:600}
.t8 .av8{width:100%;aspect-ratio:1;border-radius:10px;background:#e4e6eb center/cover;border:1px solid var(--border)}
.t8:hover .av8{border-color:var(--accent)}
.post{background:#fff;border-radius:12px;padding:18px;margin-bottom:14px;box-shadow:0 1px 2px rgba(0,0,0,.1)}
.post h4{color:var(--text);font-size:17px;font-weight:700}
.media{position:relative;margin-top:8px;-webkit-user-select:none;user-select:none}
.media img,.media video{max-width:100%;border-radius:12px;display:block;pointer-events:auto}
.media.reel video,.media.reel img{max-height:70vh;margin:0 auto;aspect-ratio:9/16;object-fit:cover}
.media iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:12px}
.wm-diag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none;overflow:hidden;z-index:2}
.wm-diag span{transform:rotate(-24deg);font-weight:800;color:rgba(255,255,255,.4);text-shadow:0 0 4px rgba(0,0,0,.35);font-size:clamp(12px,2.4vw,20px);white-space:nowrap}
.wm-tag{position:absolute;right:8px;top:8px;background:rgba(0,0,0,.55);color:#fff;font-size:10px;font-weight:700;padding:2px 8px;border-radius:8px;pointer-events:none;z-index:2}
.music iframe{width:100%;border:none;border-radius:10px}
.music audio{width:100%}
.livebox iframe{width:100%;aspect-ratio:16/9;border:none;border-radius:10px}
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:#1c1e21;color:#fff;padding:12px 24px;border-radius:8px;display:none;z-index:200;font-weight:600;box-shadow:0 4px 16px rgba(0,0,0,.3)}
.empty{text-align:center;color:var(--dim);padding:48px 0;font-size:16px}
.overlay{position:fixed;inset:0;background:rgba(0,0,0,.75);z-index:150;display:flex;align-items:center;justify-content:center;text-align:center;color:#fff;padding:20px}
.linkrow{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.gate h2{font-size:24px;font-weight:800;margin-bottom:10px}
a{color:var(--accent)}
.authbox{max-width:440px;margin:60px auto}
.center{text-align:center}
.t8pick{display:flex;gap:8px;align-items:center;background:var(--bg);border-radius:8px;padding:8px 12px;margin-bottom:6px}
.t8pick img{width:32px;height:32px;border-radius:50%;object-fit:cover}
.filterbar{display:flex;gap:16px;align-items:center;flex-wrap:wrap;background:#fff;border-radius:12px;padding:10px 16px;margin-bottom:16px;font-size:13px;font-weight:600;box-shadow:0 1px 2px rgba(0,0,0,.1);color:var(--dim)}
.filterbar input[type=text]{max-width:240px;padding:7px 12px;font-size:13px}
hr{border:none;border-top:1px solid var(--border);margin:16px 0}
.feedchips{margin:10px 0 0}
.feedchips .chip.on{border-color:var(--accent);background:#e7f3ff;color:var(--accent)}
#chatov{position:fixed;right:16px;bottom:16px;width:400px;max-width:96vw;height:540px;max-height:85vh;background:#fff;border-radius:12px;z-index:180;display:flex;flex-direction:column;box-shadow:0 12px 40px rgba(0,0,0,.3)}
#chatov .ch{display:flex;align-items:center;gap:8px;padding:12px 14px;background:var(--accent);color:#fff;border-radius:12px 12px 0 0;font-weight:700}
#chatov .cm{flex:1;overflow-y:auto;padding:12px}
.cmsg{max-width:85%;padding:9px 13px;border-radius:16px;margin-bottom:8px;font-size:14px;white-space:pre-wrap}
.cmsg.u{background:var(--accent);color:#fff;margin-left:auto}
.cmsg.a{background:#e4e6eb;color:var(--text)}
#chatov .ci{display:flex;gap:6px;padding:10px;border-top:1px solid var(--border)}
#chatov .ci textarea{min-height:40px;max-height:100px}
.albgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px;margin-top:8px}
.albitem{position:relative;display:block;border-radius:10px;overflow:hidden;border:1px solid var(--border);text-decoration:none;color:var(--text);background:var(--bg)}
.albitem:hover{border-color:var(--accent)}
.albitem img{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.albitem .cap{display:block;font-size:11px;font-weight:600;padding:4px 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.albitem .goicon{position:absolute;top:4px;right:4px;background:rgba(0,0,0,.55);color:#fff;border-radius:6px;padding:1px 6px;font-size:11px}
.wizchip{display:inline-block;background:#fff;border:1px solid var(--border);border-radius:50px;padding:8px 16px;margin:4px;cursor:pointer;font-weight:600;font-size:14px}
.wizchip.on{border-color:var(--accent);background:#e7f3ff;color:var(--accent)}
.wizbox{background:#fff;border-radius:12px;padding:28px;max-width:560px;width:100%;color:var(--text);text-align:left;max-height:85vh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.3)}
.wizbox h2{font-size:20px;font-weight:800;margin-bottom:6px}
</style>
</head>
<body>
<header>
  <h1 onclick="go('')">MyPersonas</h1>
  <input id="gsearch" placeholder="🔍 find personas..." onkeydown="if(event.key==='Enter')go('search/'+encodeURIComponent(this.value))">
  <nav>
    <button onclick="go('')">Entangle</button>
    <button onclick="go('studio')">Matrix<span id="reqBadge" class="badge" style="display:none"></span></button>
    <button id="authBtn" onclick="authAction()">Sign in</button>
  </nav>
</header>
<main id="app"><div class="empty">Loading…</div></main>
<div id="toast"></div>
<script>
// ================= CONFIG — paste your Supabase values here =================
const CONFIG={
  SUPABASE_URL:"https://nwsqyuucwzihruszocge.supabase.co",
  SUPABASE_ANON_KEY:"sb_publishable_vN6BdSvBKf_yTJt0eeK20w_afKz1Df2"
};
// ============================================================================
const PLATS={
twitter:{name:"X / Twitter",icon:"𝕏"},instagram:{name:"Instagram",icon:"📸"},facebook:{name:"Facebook",icon:"📘"},
tiktok:{name:"TikTok",icon:"🎵"},onlyfans:{name:"OnlyFans",icon:"🔒"},patreon:{name:"Patreon",icon:"🅿️"},
snapchat:{name:"Snapchat",icon:"👻"},discord:{name:"Discord",icon:"💬"},reddit:{name:"Reddit",icon:"👽"},
youtube:{name:"YouTube",icon:"▶️"},twitch:{name:"Twitch",icon:"🎮"},kick:{name:"Kick",icon:"🟢"},
rumble:{name:"Rumble",icon:"📹"},steam:{name:"Steam",icon:"🎲"},psn:{name:"PlayStation",icon:"🕹️"},
xbox:{name:"Xbox",icon:"🟩"},nintendo:{name:"Nintendo",icon:"🍄"},epic:{name:"Epic Games",icon:"🏰"},
linkedin:{name:"LinkedIn",icon:"💼"},signal:{name:"Signal",icon:"🔵"},whatsapp:{name:"WhatsApp",icon:"🟢"},
telegram:{name:"Telegram",icon:"✈️"},bluesky:{name:"Bluesky",icon:"🦋"},threads:{name:"Threads",icon:"🧵"},
legalzoom:{name:"LegalZoom",icon:"📜"},wix:{name:"Wix",icon:"🧩"},fiverr:{name:"Fiverr",icon:"🛠️"},
amazon:{name:"Amazon / Affiliate",icon:"🛒"},etsy:{name:"Etsy",icon:"🧶"},yelp:{name:"Yelp",icon:"⭐"},
trustpilot:{name:"Trustpilot",icon:"✅"},gmail:{name:"Gmail",icon:"📧"},outlook:{name:"Outlook",icon:"📨"},proton:{name:"Proton Mail",icon:"🔐"},
website:{name:"Website / Store",icon:"🌐"},email:{name:"Email / Newsletter",icon:"✉️"},other:{name:"Other",icon:"🔗"}};
let sb=null,session=null,myPersonas=[],myBlocks=[],pendingIn=[],myBackends=[],myTasks=[],myProfile=null;
const app=document.getElementById("app");
function toast(m){const t=document.getElementById("toast");t.textContent=m;t.style.display="block";setTimeout(()=>t.style.display="none",2500)}
function esc(s){return (s||"").toString().replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]))}
function go(h){location.hash="#/"+h}
function copyText(t){navigator.clipboard.writeText(t).then(()=>toast("Copied ✓"))}
function pageUrl(handle){return location.host+location.pathname.replace(/index\.html$/,"")+"#/p/"+handle}

// ---------- embeds ----------
function ytId(u){const m=u.match(/(?:youtube\.com\/(?:watch\?v=|shorts\/|live\/)|youtu\.be\/)([\w-]{6,})/);return m?m[1]:null}
function mediaHtml(u,handle,kind){
  if(!u)return "";
  const wm=`<div class="wm-diag"><span>★ ${esc(pageUrl(handle))}</span></div><div class="wm-tag">@${esc(handle)}</div>`;
  const y=ytId(u);const cls="media"+(kind==="reel"?" reel":"");
  const guard=`oncontextmenu="return false"`;
  if(y)return `<div class="${cls}" ${guard}><iframe src="https://www.youtube.com/embed/${y}" allowfullscreen></iframe></div>`;
  if(/open\.spotify\.com/.test(u))return `<div class="${cls}" ${guard}><iframe src="${esc(u.replace("open.spotify.com/","open.spotify.com/embed/"))}" style="height:152px"></iframe></div>`;
  if(/\.(mp4|webm|mov)(\?|$)/i.test(u))return `<div class="${cls}" ${guard}><video src="${esc(u)}" controls controlslist="nodownload" draggable="false"></video>${wm}</div>`;
  if(/\.(mp3|ogg|wav)(\?|$)/i.test(u))return `<div class="${cls}" ${guard}><audio src="${esc(u)}" controls></audio></div>`;
  return `<div class="${cls}" ${guard}><img src="${esc(u)}" loading="lazy" draggable="false" alt="">${wm}</div>`;
}
function musicHtml(u){
  if(!u)return "";
  const y=ytId(u);
  if(y)return `<iframe style="aspect-ratio:16/9" src="https://www.youtube.com/embed/${y}" allowfullscreen></iframe>`;
  if(/open\.spotify\.com/.test(u))return `<iframe src="${esc(u.replace("open.spotify.com/","open.spotify.com/embed/"))}" style="height:152px"></iframe>`;
  if(/soundcloud\.com/.test(u))return `<iframe style="height:120px" src="https://w.soundcloud.com/player/?url=${encodeURIComponent(u)}&color=%23ff4fa3"></iframe>`;
  if(/\.(mp3|ogg|wav)(\?|$)/i.test(u))return `<audio src="${esc(u)}" controls loop></audio>`;
  return `<a href="${esc(u)}" target="_blank" rel="noopener">🎵 ${esc(u)}</a>`;
}
function liveHtml(u){
  if(!u)return "";
  let tw=u.match(/twitch\.tv\/([\w_]+)/);
  if(tw)return `<iframe src="https://player.twitch.tv/?channel=${tw[1]}&parent=${location.hostname}" allowfullscreen></iframe>`;
  const y=ytId(u);
  if(y)return `<iframe src="https://www.youtube.com/embed/${y}?autoplay=0" allowfullscreen></iframe>`;
  let kk=u.match(/kick\.com\/([\w_-]+)/);
  if(kk)return `<iframe src="https://player.kick.com/${kk[1]}" allowfullscreen></iframe>`;
  return `<a class="btn" href="${esc(u)}" target="_blank" rel="noopener">🔴 Watch live ↗</a>`;
}

// ---------- init ----------
if(CONFIG.SUPABASE_URL.startsWith("PASTE")){
  app.innerHTML=`<div class="card authbox center"><h3>⚙ Almost ready!</h3>
  <p>This app needs its Supabase backend connected. Open <b>index.html</b> and paste your <b>Project URL</b> and <b>anon key</b> into the CONFIG block at the top of the script. See SETUP-GUIDE.md.</p></div>`;
}else{
  sb=supabase.createClient(CONFIG.SUPABASE_URL,CONFIG.SUPABASE_ANON_KEY);
  sb.auth.onAuthStateChange((ev,s)=>{
    session=s;updateAuthBtn();
    if(ev==="TOKEN_REFRESHED"||ev==="INITIAL_SESSION")return; // don't re-render (would wipe forms in progress)
    loadMine().then(route);
  });
  sb.auth.getSession().then(({data})=>{session=data.session;updateAuthBtn();loadMine().then(route)});
  window.addEventListener("hashchange",route);
}
function updateAuthBtn(){document.getElementById("authBtn").textContent=session?"Sign out":"Sign in"}
async function loadMine(){
  myPersonas=[];myBlocks=[];pendingIn=[];myBackends=[];myTasks=[];
  if(!session){updateBadge();return}
  const[{data:ps},{data:bl},{data:be},{data:tk},{data:prof}]=await Promise.all([
    sb.from("personas").select("*").eq("owner",session.user.id).order("created_at"),
    sb.from("blocks").select("*").eq("blocker",session.user.id),
    sb.from("ai_backends").select("*").eq("owner",session.user.id).order("created_at"),
    sb.from("ai_tasks").select("*").eq("owner",session.user.id).order("created_at"),
    sb.from("profiles").select("*").eq("id",session.user.id).maybeSingle()
  ]);
  myPersonas=ps||[];myBlocks=bl||[];myBackends=be||[];myTasks=tk||[];myProfile=prof||null;
  if(myProfile&&myProfile.prefs&&Object.keys(myProfile.prefs).length)localStorage.setItem("ps_filters",JSON.stringify(myProfile.prefs));
  if(myPersonas.length){
    const{data:reqs}=await sb.from("follows").select("*, personas!follows_follower_fkey(id,handle,name,avatar_url)")
      .eq("status","pending").in("target",myPersonas.map(m=>m.id));
    pendingIn=reqs||[];
  }
  updateBadge();
}
function updateBadge(){
  const b=document.getElementById("reqBadge");
  if(pendingIn.length){b.style.display="flex";b.textContent=pendingIn.length}else b.style.display="none";
}
function authAction(){if(session){sb.auth.signOut().then(()=>{toast("Signed out");go("")})}else go("signin")}
function isHidden(personaId){return myBlocks.some(b=>b.blocked_persona===personaId)}

// ---------- router ----------
async function route(){
  const h=location.hash.replace(/^#\//,"");
  document.body.classList.remove("custom-bg");document.body.style.backgroundImage="";
  document.body.classList.toggle("app-bg",!!session);
  const view=h.split("/")[0],arg=decodeURIComponent(h.split("/").slice(1).join("/")||"");
  if(view==="p")return renderPersonaPage(arg);
  if(view==="studio")return renderStudio();
  if(view==="edit")return renderEdit(arg);
  if(view==="signin")return renderSignin();
  if(view==="search")return renderDiscover(arg);
  return renderDiscover("");
}

// ---------- sign in ----------
function renderSignin(){
  if(session){go("studio");return}
  app.innerHTML=`<div class="card authbox">
    <h3 class="center">Welcome to MyPersonas</h3>
    <p class="muted center">One account, many personas. Your identity stays private — pages never show who owns them.</p>
    <button class="btn" style="width:100%;margin-top:14px" onclick="googleSignin()">Continue with Google</button>
    <hr>
    <label>Or get a magic link by email</label>
    <input id="mlEmail" type="email" placeholder="you@example.com">
    <button class="btn sec" style="width:100%;margin-top:10px" onclick="magicLink()">Email me a sign-in link</button>
    <p class="muted" style="margin-top:12px">🔐 Your email is used only to sign in. It is never shown on any page, post, or persona.</p>
  </div>`;
}
async function googleSignin(){
  const{error}=await sb.auth.signInWithOAuth({provider:"google",options:{redirectTo:location.origin+location.pathname}});
  if(error)toast(error.message);
}
async function magicLink(){
  const email=document.getElementById("mlEmail").value.trim();
  if(!email){toast("Enter your email");return}
  const{error}=await sb.auth.signInWithOtp({email,options:{emailRedirectTo:location.origin+location.pathname}});
  toast(error?error.message:"Check your email for the link! ✉️");
}

// ---------- discover ----------
function getFilters(){try{const f=JSON.parse(localStorage.getItem("ps_filters"))||{};return{hideNsfw:f.hideNsfw!==false,hideTopics:f.hideTopics||""}}catch(e){return{hideNsfw:true,hideTopics:""}}}
function settingsCard(){
  const f=getFilters();
  return `<div class="card" style="margin-top:20px"><h3>⚙️ Account settings</h3>

// ---------- friends / blocks ----------
async function pickMine(){
  if(myPersonas.length===1)return myPersonas[0].id;
  const pick=prompt("Act as which of your personas?\n"+myPersonas.map((m,i)=>`${i+1}. ${m.name}`).join("\n"),"1");
  const idx=parseInt(pick)-1;
  return (!isNaN(idx)&&myPersonas[idx])?myPersonas[idx].id:null;
}
async function sendRequest(targetId){
  const follower=await pickMine();if(!follower)return;
  const{error}=await sb.from("follows").insert({follower,target:targetId,status:"pending"});
  if(error){toast(error.message.includes("row-level")?"You can't send this request (blocked or not allowed)":error.message);return}
  toast("Friend request sent! 💌");route();
}
async function acceptReq(id){
  const{error}=await sb.from("follows").update({status:"accepted"}).eq("id",id);
  if(error){toast(error.message);return}
  toast("Friends! 💖");await loadMine();route();
}
async function declineReq(id){await sb.from("follows").delete().eq("id",id);await loadMine();route()}
async function unfriend(targetId){
  const ids=myPersonas.map(m=>m.id);
  await sb.from("follows").delete().or(`and(target.eq.${targetId},follower.in.(${ids.join(",")})),and(follower.eq.${targetId},target.in.(${ids.join(",")}))`);
  toast("Removed");route();
}
async function blockPersona(pid,kind){
  if(isHidden(pid)&&kind==="block"){
    await sb.from("blocks").delete().eq("blocker",session.user.id).eq("blocked_persona",pid);
    await loadMine();toast("Unblocked");route();return;
  }
  if(!confirm(kind==="block"?"Block this persona? They won't be able to friend you, and you won't see them.":"Mute this persona? You won't see them anywhere (they can still see your public pages)."))return;
  const{error}=await sb.from("blocks").insert({blocker:session.user.id,blocked_persona:pid,kind});
  if(error&&!error.message.includes("duplicate")){toast(error.message);return}
  if(kind==="block")await unfriendQuiet(pid);
  await loadMine();toast(kind==="block"?"Blocked 🚫":"Muted 🔇");go("");
}
async function unfriendQuiet(targetId){
  const ids=myPersonas.map(m=>m.id);
  if(ids.length)await sb.from("follows").delete().or(`and(target.eq.${targetId},follower.in.(${ids.join(",")})),and(follower.eq.${targetId},target.in.(${ids.join(",")}))`);
}

async function callAI(backendId,messages){
  const b=myBackends.find(x=>x.id===backendId)||myBackends[0];
  if(!b)throw new Error("No AI model linked. Add one in Matrix → AI Models.");
  const r=await fetch(b.base_url.replace(/\/$/,"")+"/chat/completions",{method:"POST",
    headers:{"Content-Type":"application/json","Authorization":"Bearer "+b.api_key},
    body:JSON.stringify({model:b.model,messages,max_tokens:2500})});
  const j=await r.json();
  if(!r.ok)throw new Error(j.error?.message||("HTTP "+r.status));
  return j.choices[0].message.content;
}
let chatCtx=null;
function openChat(opts){
  closeChat();
  chatCtx={...opts,busy:false,messages:JSON.parse(localStorage.getItem(opts.storeKey)||"[]")};
  const d=document.createElement("div");d.id="chatov";
  d.innerHTML=`<div class="ch">🤖 ${esc(opts.title)}
    <span style="margin-left:auto;display:flex;gap:6px">
    ${opts.extract?`<button class="btn sm" style="background:#fff;color:var(--accent2)" onclick="chatExtract()">✨ Apply to profile</button>`:""}
    <button class="btn sm" style="background:rgba(255,255,255,.25);box-shadow:none" onclick="localStorage.removeItem(chatCtx.storeKey);chatCtx.messages=[];renderChatMsgs()">🧹</button>
    <button class="btn sm" style="background:rgba(255,255,255,.25);box-shadow:none" onclick="closeChat()">✕</button></span></div>
    <div class="cm" id="chatMsgs"></div>
    <div class="ci"><textarea id="chatIn" placeholder="type…" onkeydown="if(event.key==='Enter'&&!event.shiftKey){event.preventDefault();chatSend()}"></textarea>
    <button class="btn" onclick="chatSend()">➤</button></div>`;
  document.body.appendChild(d);
  renderChatMsgs();
  if(opts.autoSend&&!chatCtx.messages.length){document.getElementById("chatIn").value=opts.autoSend;chatSend()}
}
function closeChat(){const d=document.getElementById("chatov");if(d)d.remove();chatCtx=null}
function renderChatMsgs(){
  const el=document.getElementById("chatMsgs");if(!el||!chatCtx)return;
  el.innerHTML=chatCtx.messages.map(m=>`<div class="cmsg ${m.role==="user"?"u":"a"}">${esc(m.content)}</div>`).join("")
    +(chatCtx.busy?'<div class="cmsg a">…thinking ✨</div>':"")
    +(chatCtx.messages.length?`<div class="center" style="margin:6px 0"><button class="btn sec sm" onclick="copyText(chatCtx.messages.filter(m=>m.role==='assistant').slice(-1)[0]?.content||'')">📋 Copy last reply</button></div>`:"");
  el.scrollTop=el.scrollHeight;
}
async function chatSend(){
  if(!chatCtx||chatCtx.busy)return;
  const inp=document.getElementById("chatIn");const text=inp.value.trim();if(!text)return;
  inp.value="";chatCtx.messages.push({role:"user",content:text});chatCtx.busy=true;renderChatMsgs();
  try{
    const reply=await callAI(chatCtx.backendId,[{role:"system",content:chatCtx.system},...chatCtx.messages]);
    chatCtx.messages.push({role:"assistant",content:reply});
  }catch(e){chatCtx.messages.push({role:"assistant",content:"⚠ "+e.message})}

function wizMerged(){

    purpose:uniq(cs.map(c=>c.purpose)).join(". "),
    topics:uniq(cs.flatMap(c=>c.topics.split(",").map(t=>t.trim()))).join(", "),
    hashtags:uniq(cs.flatMap(c=>c.hashtags.split(" "))).join(" "),
    plats:uniq(cs.flatMap(c=>c.plats))

    const j=JSON.parse(raw.replace(/^```json?\s*/i,"").replace(/```\s*$/,"").trim());

// ---------- uploads + watermarking ----------
async function watermarkImage(file,text){
  if(!file.type.startsWith("image/")||file.type==="image/gif")return file; // gifs keep animation
  try{
    const img=await createImageBitmap(file);
    const c=document.createElement("canvas");c.width=img.width;c.height=img.height;
    const ctx=c.getContext("2d");ctx.drawImage(img,0,0);
    const fs=Math.max(16,Math.round(img.width/28));
    ctx.font=`800 ${fs}px 'Trebuchet MS',sans-serif`;
    ctx.textBaseline="middle";
    ctx.save();ctx.translate(img.width/2,img.height/2);ctx.rotate(-24*Math.PI/180);
    const tw=ctx.measureText(text).width+fs*3;
    ctx.globalAlpha=.30;
    for(let y=-img.height;y<img.height;y+=fs*5){
      for(let x=-img.width-tw;x<img.width+tw;x+=tw){
        ctx.fillStyle="#fff";ctx.fillText(text,x,y+1);
        ctx.fillStyle="rgba(0,0,0,.85)";ctx.globalAlpha=.18;ctx.fillText(text,x+2,y+3);ctx.globalAlpha=.30;
      }
    }
    ctx.restore();
    ctx.globalAlpha=.9;ctx.font=`800 ${Math.max(13,Math.round(fs*.7))}px 'Trebuchet MS',sans-serif`;
    const pad=8,label="★ "+text,lw=ctx.measureText(label).width;
    ctx.fillStyle="rgba(0,0,0,.55)";ctx.fillRect(img.width-lw-pad*3,img.height-fs*1.6-pad,lw+pad*2,fs*1.4);
    ctx.fillStyle="#fff";ctx.fillText(label,img.width-lw-pad*2,img.height-fs*.9-pad+2);
    return new Promise(res=>c.toBlob(b=>res(new File([b],file.name.replace(/\.\w+$/,"")+"-wm.jpg",{type:"image/jpeg"})),"image/jpeg",.92));
  }catch(e){return file}
}
function uploadTo(inputId,watermark){
  if(!session){toast("Sign in first");return}
  const f=document.createElement("input");f.type="file";f.accept="image/*,video/mp4,video/webm";
  f.onchange=async()=>{
    let file=f.files[0];if(!file)return;
    if(file.size>15*1024*1024){toast("Max 15 MB — host bigger files elsewhere and paste the URL");return}
    toast("Uploading…");
    if(watermark&&pageState.p)file=await watermarkImage(file,pageUrl(pageState.p.handle));
    const path=`${session.user.id}/${Date.now()}-${file.name.replace(/[^\w.\-]/g,"_")}`;
    const{error}=await sb.storage.from("media").upload(path,file);
    if(error){toast(error.message);return}
    document.getElementById(inputId).value=sb.storage.from("media").getPublicUrl(path).data.publicUrl;
    toast(watermark&&/^image\/(?!gif)/.test(file.type)?"Uploaded + watermarked ✓":"Uploaded ✓");
  };
  f.click();
}
