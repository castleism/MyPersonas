project_id = "nwsqyuucwzihruszocge"

# Signed-in browser endpoints keep gateway JWT verification enabled.
[functions.ai-proxy]
verify_jwt = true

[functions.openrouter-connect]
verify_jwt = true

[functions.post-bridge]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.erase-content]
verify_jwt = true

# Public or cron-secret-authenticated endpoints perform their own authorization.
[functions.fan-chat]
verify_jwt = false

# Public CAPTCHA intake has no user JWT. The function itself requires one exact
# configured origin, bounded JSON, Turnstile verification, and the service RPC.
[functions.request-review]
verify_jwt = false

# Public offer links must open without a JWT. The function resolves only the
# database-controlled active destination before issuing a redirect.
[functions.affiliate-redirect]
verify_jwt = false

[functions.gmail-oauth]
verify_jwt = false

[functions.mailbox-manager]
verify_jwt = true

[functions.twitter-oauth]
verify_jwt = false

# Reddit's OAuth callback validates its signed state; posting requires an owner JWT.
[functions.reddit-oauth]
verify_jwt = false

[functions.reddit-post]
verify_jwt = true

# Source remains deployed fail-closed/dormant until the Discord safety rebuild is complete.
[functions.discord-post]
verify_jwt = true

[functions.meta-oauth]
verify_jwt = false

[functions.meta-post]
verify_jwt = true

[functions.compose-post]
verify_jwt = true

[functions.approve-post-draft]
verify_jwt = true

[functions.run-post-queue]
verify_jwt = false

[functions.run-tasks]
verify_jwt = false

[functions.run-publish-queue]
verify_jwt = false

[functions.run-mailbox-jobs]
verify_jwt = false

# Bounded retention worker. It authenticates one exact X-Cron-Secret against
# the existing CRON_SECRET and writes only fixed-name/count heartbeat metadata.
# This configuration does not create or activate an external schedule.
[functions.run-operations-maintenance]
verify_jwt = false

[functions.sitemap]
verify_jwt = false

[functions.gemini-image]
verify_jwt = true

[functions.media-ingest]
verify_jwt = true
static_files = ["./functions/media-ingest/MyPersonas-AI-Watermark.png"]

# Opaque public ids are resolved server-side only after the exact current page
# review is rechecked. The function proxies bounded hash-verified bytes and never
# redirects to the owner-correlating private Storage path. It also requires the
# CloudFront-only X-MyPersonas-Media-Gateway header to match the separately
# configured PUBLIC_MEDIA_GATEWAY_SECRET; a missing secret disables the origin.
[functions.public-media]
verify_jwt = false

# Approved social renditions use the same protected CloudFront origin contract
# as persona media. The Edge function verifies the gateway secret itself,
# re-resolves the exact approved reference, and streams hash-verified bytes.
[functions.approved-media]
verify_jwt = false

# Authenticated owner/friend preview returns verified bytes directly. It never
# exposes a private Storage path or signed URL to the browser.
[functions.owner-media-preview]
verify_jwt = true

# AAL2 owner-only inventory and exact-byte preview for the historical `media`
# bucket. Raw Storage paths and integrity hashes remain service-only.
[functions.legacy-media-remediation]
verify_jwt = true

[functions.agent-board-propose]
verify_jwt = true

[functions.agent-board-run]
verify_jwt = true
