# Signed-in browser endpoints keep gateway JWT verification enabled.
[functions.ai-proxy]
verify_jwt = true

[functions.post-bridge]
verify_jwt = true

[functions.delete-account]
verify_jwt = true

[functions.erase-content]
verify_jwt = true

# Public or cron-secret-authenticated endpoints perform their own authorization.
[functions.fan-chat]
verify_jwt = false

[functions.gmail-oauth]
verify_jwt = false

[functions.mailbox-manager]
verify_jwt = true

[functions.twitter-oauth]
verify_jwt = false

# Reddit's OAuth callback validates its signed state; posting requires an owner JWT.
[functions.reddit-oauth]
verify_jwt = false

[functions.reddit-post]
verify_jwt = true

# Source remains deployed fail-closed/dormant until the Discord safety rebuild is complete.
[functions.discord-post]
verify_jwt = true

[functions.meta-oauth]
verify_jwt = false

[functions.meta-post]
verify_jwt = true

[functions.compose-post]
verify_jwt = true

[functions.approve-post-draft]
verify_jwt = true

[functions.run-post-queue]
verify_jwt = false

[functions.run-tasks]
verify_jwt = false

[functions.run-publish-queue]
verify_jwt = false

[functions.run-mailbox-jobs]
verify_jwt = false

[functions.sitemap]
verify_jwt = false

[functions.gemini-image]
verify_jwt = true
