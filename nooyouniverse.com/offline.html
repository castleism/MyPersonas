<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0b0e24">
  <meta name="robots" content="noindex">
  <title>Offline — Noo YouNiverse</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/svg+xml" href="./assets/favicon.svg">
  <style>
    body{min-height:100vh;margin:0;padding:24px;display:grid;place-items:center;background:#0b0e24;color:#e9ebf7;font-family:ui-sans-serif,system-ui,sans-serif;text-align:center}
    main{max-width:440px}
    img{width:96px;height:96px;border-radius:22px}
    h1{margin:18px 0 8px;font-size:clamp(28px,7vw,40px)}
    p{color:#a7add0;line-height:1.55}
    a{display:inline-block;min-height:44px;margin-top:16px;padding:12px 22px;border-radius:999px;background:#f2b25c;color:#231803;font-weight:700;text-decoration:none}
    small{display:block;margin-top:18px;color:#a7add0}
  </style>
</head>
<body>
  <main>
    <img src="./assets/favicon.svg" alt="">
    <h1>Signal lost</h1>
    <p>Reconnect to load the public mission log. Noo YouNiverse does not store waitlist submissions or third-party responses in its offline cache.</p>
    <a href="./">Try again</a>
    <small>This offline screen cannot publish, approve, or change anything.</small>
  </main>
</body>
</html>
