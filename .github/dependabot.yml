version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "16:00"
      timezone: America/Anchorage
    open-pull-requests-limit: 5
    reviewers:
      - castleism
    labels:
      - dependencies
    groups:
      reviewed-github-actions:
        patterns:
          - "*"

