name: Deploy Supabase Edge Functions

# Owner-triggered deployment only. The installed Supabase GitHub App has
# previously auto-applied main-branch migrations before CI completed. Disable or
# replace that provider integration before any migration-bearing commit reaches
# main. This workflow deploys functions only; it never applies migrations.
#
# Required protected-environment secrets:
#   supabase-staging: STAGING_SUPABASE_ACCESS_TOKEN,
#                     STAGING_SUPABASE_PROJECT_REF
#   production:       PRODUCTION_SUPABASE_ACCESS_TOKEN,
#                     PRODUCTION_SUPABASE_PROJECT_REF
# Never provide either access token as a repository- or organization-level
# fallback. Each target has a separate job so a staging dispatch cannot evaluate
# or inherit the production credential. The reviewed deploy script writes the
# exact MYPERSONAS_DEPLOYMENT_ENVIRONMENT binding and, for staging only, the
# protected MYPERSONAS_STAGING_PROJECT_REF before deploying any function.
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Enter the exact reviewed confirmation required by the selected target and scope"
        required: true
        type: string
      release_scope:
        description: "Deploy only this reviewed function set"
        required: true
        default: "opaque-media-foundation"
        type: choice
        options:
          - opaque-media-foundation
          - opaque-media-intake-pilot
          - opaque-media-producers
          - billing-test-boundary
          - billing-entitlement-consumers
          - public-intake
          - operations-maintenance
          - persona-source-library
      deployment_target:
        description: "Deploy to the separately protected staging or production environment"
        required: true
        default: "staging"
        type: choice
        options:
          - staging
          - production
      project_ref_confirmation:
        description: "Enter the exact 20-character project ref for the selected protected environment"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy-staging:
    name: Deploy functions to protected staging
    if: ${{ inputs.deployment_target == 'staging' }}
    runs-on: ubuntu-latest
    environment:
      name: supabase-staging
    env:
      DEPLOYMENT_TARGET: staging
      RELEASE_SCOPE: ${{ inputs.release_scope }}
      RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
      PROJECT_REF_CONFIRMATION: ${{ inputs.project_ref_confirmation }}
      APPROVED_PROJECT_REF: ${{ secrets.STAGING_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.STAGING_SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0
      - name: Validate evidence and deploy the exact staging function set
        run: bash ./scripts/deploy-supabase-functions.sh

  deploy-production:
    name: Deploy functions to protected production
    if: ${{ inputs.deployment_target == 'production' }}
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      DEPLOYMENT_TARGET: production
      RELEASE_SCOPE: ${{ inputs.release_scope }}
      RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
      PROJECT_REF_CONFIRMATION: ${{ inputs.project_ref_confirmation }}
      APPROVED_PROJECT_REF: ${{ secrets.PRODUCTION_SUPABASE_PROJECT_REF }}
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0
      - name: Validate evidence and deploy the exact production function set
        run: bash ./scripts/deploy-supabase-functions.sh
