name: Deploy Supabase Edge Functions

# Owner-triggered deployment for Edge Functions. This deliberately does not run
# on push: several functions have hard schema dependencies and migrations stay
# review-only. verify_jwt per function comes from supabase/config.toml.
#
# REQUIRED repo secret: SUPABASE_ACCESS_TOKEN  (Account → Access Tokens)
# Project ref is read from supabase/config.toml (project_id).
#
# Migrations are intentionally NOT auto-applied here — they are reviewed and run
# deliberately (see CI-CD-SETUP.md). This workflow only ships function code.
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Type MIGRATIONS-VERIFIED after the linked database is read back through migration 058"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Require reviewed database release evidence
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          test "${RELEASE_CONFIRMATION}" = "MIGRATIONS-VERIFIED" || {
            echo "Deployment blocked: verify and read back migrations before function code."
            exit 1
          }
          test -n "${SUPABASE_ACCESS_TOKEN}" || {
            echo "Deployment blocked: SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Read project ref from config.toml
        id: cfg
        run: |
          ref=$(grep -E '^project_id' supabase/config.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Project ref: $ref"

      - name: Deploy all edge functions
        run: |
          supabase functions deploy --project-ref "${{ steps.cfg.outputs.ref }}"
