name: Deploy Supabase Edge Functions

# CD for edge functions. Runs on merge to main when a function (or its shared
# code / config) changes. verify_jwt per function comes from supabase/config.toml.
#
# REQUIRED repo secret: SUPABASE_ACCESS_TOKEN  (Account → Access Tokens)
# Project ref is read from supabase/config.toml (project_id).
#
# Migrations are intentionally NOT auto-applied here — they are reviewed and run
# deliberately (see CI-CD-SETUP.md). This workflow only ships function code.
on:
  push:
    branches: [main]
    paths:
      - "supabase/functions/**"
      - "supabase/config.toml"
      - ".github/workflows/supabase-deploy.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - name: Guard — require access token
        run: |
          if [ -z "${SUPABASE_ACCESS_TOKEN}" ]; then
            echo "SUPABASE_ACCESS_TOKEN secret is not set. Add it in repo Settings → Secrets."
            exit 1
          fi

      - uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Read project ref from config.toml
        id: cfg
        run: |
          ref=$(grep -E '^project_id' supabase/config.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Project ref: $ref"

      - name: Deploy all edge functions
        run: |
          supabase functions deploy --project-ref "${{ steps.cfg.outputs.ref }}"
