name: Deploy Supabase Edge Functions

# Owner-triggered deployment for Edge Functions. This deliberately does not run
# on push because several functions have hard schema dependencies. The installed
# Supabase GitHub App DOES auto-apply new timestamped migrations after a push to
# main, before CI may finish; therefore migration-bearing commits must be fully
# release-ready before they are pushed. verify_jwt comes from supabase/config.toml.
#
# REQUIRED production-environment secret:
#   PRODUCTION_SUPABASE_ACCESS_TOKEN  (Account → Access Tokens)
# Project ref is read from supabase/config.toml (project_id).
#
# This workflow does not itself apply migrations; it only ships function code.
# Read back the auto-applied production ledger before entering the confirmation.
on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Foundation: MIGRATIONS-062-064-GATEWAY-VERIFIED. Producers: OPAQUE-FRONTEND-VERIFIED."
        required: true
        type: string
      release_scope:
        description: "Deploy only this reviewed function set"
        required: true
        default: "opaque-media-foundation"
        type: choice
        options:
          - opaque-media-foundation
          - opaque-media-producers

permissions:
  contents: read

concurrency:
  group: supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy functions
    runs-on: ubuntu-latest
    environment:
      name: production
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.PRODUCTION_SUPABASE_ACCESS_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Require reviewed database release evidence
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          RELEASE_SCOPE: ${{ inputs.release_scope }}
        run: |
          case "${RELEASE_SCOPE}" in
            opaque-media-foundation)
              test "${RELEASE_CONFIRMATION}" = "MIGRATIONS-062-064-GATEWAY-VERIFIED" || {
                echo "Deployment blocked: read back migrations 062 through 064, then verify the protected media gateway and matching origin secret."
                exit 1
              }
              ;;
            opaque-media-producers)
              test "${RELEASE_CONFIRMATION}" = "OPAQUE-FRONTEND-VERIFIED" || {
                echo "Deployment blocked: verify the opaque-media frontend live and signed in before opaque media producers."
                exit 1
              }
              ;;
            *)
              echo "Deployment blocked: unreviewed release scope."
              exit 1
              ;;
          esac
          test -n "${SUPABASE_ACCESS_TOKEN}" || {
            echo "Deployment blocked: SUPABASE_ACCESS_TOKEN is not configured."
            exit 1
          }

      - uses: supabase/setup-cli@46f7f98c7f948ad727d22c1e67fab04c223a0520 # v3.0.0
        with:
          version: 2.115.0

      - name: Read project ref from config.toml
        id: cfg
        run: |
          ref=$(grep -E '^project_id' supabase/config.toml | head -1 | sed -E 's/.*"([^"]+)".*/\1/')
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "Project ref: $ref"

      - name: Deploy opaque-media foundation and consumers
        if: ${{ inputs.release_scope == 'opaque-media-foundation' }}
        run: |
          for function_name in public-media approved-media owner-media-preview legacy-media-remediation compose-post approve-post-draft meta-post run-post-queue delete-account erase-content; do
            supabase functions deploy "${function_name}" --project-ref "${{ steps.cfg.outputs.ref }}"
          done

      - name: Deploy opaque-media producers after frontend verification
        if: ${{ inputs.release_scope == 'opaque-media-producers' }}
        run: |
          for function_name in gemini-image media-ingest; do
            supabase functions deploy "${function_name}" --project-ref "${{ steps.cfg.outputs.ref }}"
          done
