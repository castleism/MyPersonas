name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Type MIGRATIONS-VERIFIED after migration 060 is recorded in the linked ledger and its smoke tests are reviewed"
        required: true
        type: string
      provider_release_confirmation:
        description: "Type PROVIDER-MIGRATIONS-VERIFIED after provider migrations 065-075 are applied, read back, and smoke-tested"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The current version folder to publish. Bump this on major version changes.
  SITE_DIR: MyPersonas.Online_v0

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require reviewed database release evidence
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
          PROVIDER_RELEASE_CONFIRMATION: ${{ inputs.provider_release_confirmation }}
        run: |
          test "${RELEASE_CONFIRMATION}" = "MIGRATIONS-VERIFIED" || {
            echo "Release blocked: verify migration 060 in the linked ledger and review its smoke tests first."
            exit 1
          }
          test "${PROVIDER_RELEASE_CONFIRMATION}" = "PROVIDER-MIGRATIONS-VERIFIED" || {
            echo "Release blocked: apply and read back provider migrations 065 through 075, then review their smoke tests first."
            exit 1
          }
      - name: Prepare public site artifact
        run: |
          mkdir -p .pages-artifact
          rsync -a --delete \
            --prune-empty-dirs \
            --include '/index.html' \
            --include '/owner-app.css' \
            --include '/owner-app.js' \
            --include '/cms-connector-ui.js' \
            --include '/persona-view.css' \
            --include '/persona-view.js' \
            --include '/platform-governance.css' \
            --include '/platform-governance.js' \
            --include '/ai-content-provenance.css' \
            --include '/ai-content-provenance.js' \
            --include '/profile-image-crop.css' \
            --include '/profile-image-crop.js' \
            --include '/agent-board.css' \
            --include '/agent-board.js' \
            --include '/assets/***' \
            --include '/brand/app-icon/***' \
            --include '/manifest.webmanifest' \
            --include '/service-worker.js' \
            --include '/pwa.js' \
            --include '/offline.html' \
            --include '/CNAME' \
            --include '/.nojekyll' \
            --include '/robots.txt' \
            --include '/sitemap.xml' \
            --include '/privacy.html' \
            --include '/terms.html' \
            --include '/data-deletion.html' \
            --include '/provider-setup.html' \
            --include '/PROVIDER-SETUP-GUIDE.md' \
            --exclude '*' \
            "${SITE_DIR}/" .pages-artifact/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
