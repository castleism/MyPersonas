name: Deploy site to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      release_confirmation:
        description: "Type OPAQUE-FOUNDATION-VERIFIED after migrations 062-064, cleanup preview, the protected gateway, and both opaque-media origins are live and read back"
        required: true
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The current version folder to publish. Bump this on major version changes.
  SITE_DIR: MyPersonas.Online_v0

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Require reviewed database release evidence
        env:
          RELEASE_CONFIRMATION: ${{ inputs.release_confirmation }}
        run: |
          test "${RELEASE_CONFIRMATION}" = "OPAQUE-FOUNDATION-VERIFIED" || {
            echo "Release blocked: verify migrations 062-064, cleanup preview, the protected gateway, and the foundation functions before deploying this frontend."
            exit 1
          }
      - name: Prepare public site artifact
        run: |
          mkdir -p .pages-artifact
          rsync -a --delete \
            --prune-empty-dirs \
            --include '/index.html' \
            --include '/owner-app.css' \
            --include '/owner-app.js' \
            --include '/persona-view.css' \
            --include '/persona-view.js' \
            --include '/platform-governance.css' \
            --include '/platform-governance.js' \
            --include '/ai-content-provenance.css' \
            --include '/ai-content-provenance.js' \
            --include '/profile-image-crop.css' \
            --include '/profile-image-crop.js' \
            --include '/agent-board.css' \
            --include '/agent-board.js' \
            --include '/assets/***' \
            --include '/brand/app-icon/***' \
            --include '/manifest.webmanifest' \
            --include '/service-worker.js' \
            --include '/pwa.js' \
            --include '/offline.html' \
            --include '/CNAME' \
            --include '/.nojekyll' \
            --include '/robots.txt' \
            --include '/sitemap.xml' \
            --include '/privacy.html' \
            --include '/terms.html' \
            --include '/data-deletion.html' \
            --include '/provider-setup.html' \
            --include '/PROVIDER-SETUP-GUIDE.md' \
            --exclude '*' \
            "${SITE_DIR}/" .pages-artifact/
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .pages-artifact
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
