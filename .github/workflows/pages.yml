name: Deploy site to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

env:
  # The current version folder to publish. Bump this on major version changes.
  SITE_DIR: MyPersonas.Online_v0

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare public site artifact
        run: |
          mkdir -p .pages-artifact
          rsync -a --delete \
            --prune-empty-dirs \
            --include '/index.html' \
            --include '/owner-app.css' \
            --include '/owner-app.js' \
            --include '/assets/***' \
            --include '/brand/app-icon/***' \
            --include '/manifest.webmanifest' \
            --include '/service-worker.js' \
            --include '/pwa.js' \
            --include '/offline.html' \
            --include '/CNAME' \
            --include '/.nojekyll' \
            --include '/robots.txt' \
            --include '/sitemap.xml' \
            --include '/privacy.html' \
            --include '/terms.html' \
            --include '/data-deletion.html' \
            --include '/provider-setup.html' \
            --include '/PROVIDER-SETUP-GUIDE.md' \
            --exclude '*' \
            "${SITE_DIR}/" .pages-artifact/
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages-artifact
      - id: deployment
        uses: actions/deploy-pages@v4
