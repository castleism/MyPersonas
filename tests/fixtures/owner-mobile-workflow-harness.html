<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner mobile workflow harness (fixture)</title>
  <link rel="stylesheet" href="../../MyPersonas.Online_v0/owner-app.css">
  <style>
    body { margin: 0; background: #eef3f9; }
    .harness-banner { background: #172c4d; color: #fff; padding: 12px 16px; font: 14px/1.4 sans-serif; }
    .harness-banner strong { display: block; margin-bottom: 4px; }
    #app { padding: 16px; }
  </style>
</head>
<body>
  <div class="harness-banner">
    <strong>TEST HARNESS — not the live MyPersonas platform</strong>
    Fixture data only. publishing_enabled=false. No provider sends, OAuth, or production secrets.
    Existing phone-test prototypes are not in this checkout.
  </div>
  <div id="app" class="oa-shell"></div>
  <script src="../../MyPersonas.Online_v0/mobile-owner-workflow.js"></script>
  <script>
    const owner = "owner-1";
    const personas = [
      { id: "persona-a", owner, name: "Alpha", handle: "alpha", avatar_url: "" },
      { id: "persona-b", owner, name: "Bravo", handle: "bravo", avatar_url: "" }
    ];
    const backups = [{ main_persona_id: "persona-a", backup_persona_id: "persona-b" }];
    const accounts = [
      { id: "acc-x", owner, persona_id: "persona-a", provider: "twitter", username: "alpha_x" },
      { id: "acc-ig", owner, persona_id: "persona-a", provider: "instagram", username: "alpha_ig" },
      { id: "acc-fb", owner, persona_id: "persona-a", provider: "facebook", username: "alpha_fb" },
      { id: "acc-web", owner, persona_id: "persona-a", provider: "wordpress", username: "alpha.site" }
    ];
    const groups = MobileOwnerWorkflow.filterRoster(MobileOwnerWorkflow.rosterGroups(personas, backups), "");
    const bindings = MobileOwnerWorkflow.channelBindings(accounts, owner, "persona-a");
    const request = MobileOwnerWorkflow.createPrivateDraftRequest({
      ownerId: owner,
      personaId: "persona-a",
      personas,
      accounts,
      title: "Harness private draft",
      guidance: "Fixture only",
      timezone: "UTC",
      publishingEnabled: false,
      online: true,
      variants: MobileOwnerWorkflow.CHANNELS.map((channel) => ({
        channel: channel.key, title: "", body: channel.label + " fixture copy", description: "", alt_text: "", media_plan: []
      }))
    });
    const denied = MobileOwnerWorkflow.createPrivateDraftRequest({
      ownerId: "owner-2", personaId: "persona-a", personas, accounts, variants: request.payload.p_variants
    });
    const app = document.getElementById("app");
    app.innerHTML = `
      <div class="oa-topbar"><div class="oa-brandline"><span class="oa-brandmark">A</span><div>
        <span class="oa-eyebrow">Fixture harness</span><h1 class="oa-title">Persona selection</h1></div></div></div>
      <div class="oa-picker"><span class="oa-picker-avatar"></span>
        <label><span>Working as</span><select aria-label="Select persona">${groups.map(({ main }) => `<option>${main.name} · @${main.handle}</option>`).join("")}</select></label>
        <button class="oa-secondary oa-small oa-mini" type="button">Browse</button></div>
      <div class="oa-list">${groups.flatMap(({ main, backup }) => [
        `<div class="oa-listitem on"><span class="oa-listicon">A</span><span class="oa-listcopy"><b>${main.name}</b><span>@${main.handle} · owned persona</span></span></div>`,
        backup ? `<div class="oa-listitem"><span class="oa-listicon">B</span><span class="oa-listcopy"><b>↳ ${backup.name}</b><span>Backup for ${main.name}</span></span></div>` : ""
      ]).join("")}</div>
      <section class="oa-panel wide" style="margin-top:16px">
        <div class="oa-panel-head"><div><h3>Exact account binding</h3><p class="oa-sub">publishing_enabled=${String(MobileOwnerWorkflow.PUBLISHING_ENABLED)}</p></div></div>
        <div class="oa-bindgrid">${bindings.map((row) => `<div class="oa-bind ${row.determinable ? "good" : "warn"}"><b>${row.channel}</b><span>${row.determinable ? row.account.username : row.reason}</span></div>`).join("")}</div>
      </section>
      <section class="oa-panel wide">
        <div class="oa-panel-head"><div><h3>Authorization</h3><p class="oa-sub">Owner create is accepted; foreign owner is denied.</p></div></div>
        <p class="oa-sub">Create: ${request.ok ? "owned draft payload ready" : request.error}</p>
        <p class="oa-sub">Foreign owner: ${denied.error}</p>
      </section>
      <div class="oa-sticky-cta"><button class="oa-primary" type="button">Save private draft for review</button><button class="oa-secondary" type="button">Review queue</button></div>
    `;
  </script>
</body>
</html>
