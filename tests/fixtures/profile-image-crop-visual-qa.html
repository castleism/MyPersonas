<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Profile image crop visual QA</title>
  <link rel="stylesheet" href="../../MyPersonas.Online_v0/profile-image-crop.css">
  <style>
    :root{--text:#1c1e21;--dim:#65676b;--border:#dddfe2;--accent:#1877f2;--accent2:#166fe5}
    *{box-sizing:border-box;margin:0;padding:0}body{font:15px Segoe UI,Arial,sans-serif;background:#edf3fa;color:var(--text);padding:28px}.qa{max-width:820px;margin:auto;padding:22px;border:1px solid #ccd8e6;border-radius:14px;background:#fff}.qa h1{margin-bottom:7px}.qa p{margin-bottom:14px;color:var(--dim)}.buttons{display:flex;gap:8px;flex-wrap:wrap}.btn{border:0;border-radius:8px;padding:9px 14px;background:var(--accent);color:#fff;font:700 14px inherit;cursor:pointer}.btn.sec{background:#e4e6eb;color:var(--text)}#result{margin-top:14px;font-weight:700}
  </style>
  <script src="../../MyPersonas.Online_v0/profile-image-crop.js" defer></script>
</head>
<body>
  <main class="qa">
    <h1>Profile crop visual QA</h1>
    <p>Uses an existing repository portrait and never uploads it.</p>
    <div class="buttons">
      <button class="btn" data-slot="avatar_url">Open avatar crop</button>
      <button class="btn" data-slot="banner_url">Open banner crop</button>
      <button class="btn" data-slot="bg_url">Open background crop</button>
      <button class="btn" data-slot="feed_img_url">Open feed crop</button>
    </div>
    <p id="result" role="status"></p>
  </main>
  <script>
    document.addEventListener("click",async(event)=>{
      const button=event.target.closest("[data-slot]");if(!button)return;
      const response=await fetch("../../MyPersonas.Online_v0/assets/yarra-avatar-2026-08-08.png");
      const blob=await response.blob();
      const file=new File([blob],"qa-portrait.png",{type:"image/png"});
      const cropped=await MyPersonasProfileCrop.open({file,slot:button.dataset.slot});
      document.getElementById("result").textContent=cropped?`${button.dataset.slot}: ${cropped.type}, ${cropped.size} bytes`:"Crop cancelled; prior value unchanged";
    });
  </script>
</body>
</html>
