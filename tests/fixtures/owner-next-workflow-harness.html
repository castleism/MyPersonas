<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Owner next workflow harness (fixture)</title>
  <link rel="stylesheet" href="../../MyPersonas.Online_v0/owner-app.css">
  <style>
    body { margin: 0; background: #eef3f9; }
    .harness-banner { background: #172c4d; color: #fff; padding: 12px 16px; font: 14px/1.4 sans-serif; }
    #app { padding: 16px; }
  </style>
</head>
<body>
  <div class="harness-banner">
    <strong>TEST HARNESS — not the live MyPersonas platform</strong>
    Fixture data only. publishing_enabled=false. delivery_enabled=false. No provider sends.
  </div>
  <div id="app" class="oa-shell"></div>
  <script src="../../MyPersonas.Online_v0/mobile-owner-workflow.js"></script>
  <script>
    const owner = "owner-1", other = "owner-2";
    const personas = [
      { id: "persona-a", owner, name: "Alpha", handle: "alpha" },
      { id: "persona-x", owner: other, name: "Foreign", handle: "foreign" }
    ];
    const mine = { id: "item-1", owner, persona_id: "persona-a", headline: "Owned blurb", blurb: "Private research only.", status: "owner_review", confidence: 0.4, citations: [{ url: "https://example.org/a" }] };
    const isolation = MobileOwnerWorkflow.twoAccountIsolation({ ownerA: owner, ownerB: other, record: mine });
    const research = MobileOwnerWorkflow.feedResearchRequest({ ownerId: owner, personaId: "persona-a", personas, rulesApproved: false, online: true });
    const push = MobileOwnerWorkflow.pushDeliveryStatus({ ownerId: owner, subscriptions: [] });
    const feedSurface = MobileOwnerWorkflow.allowedOwnerSurface("https://mypersonas.online/#/feed");
    const publicSurface = MobileOwnerWorkflow.allowedOwnerSurface("https://mypersonas.online/#/persona/alpha");
    const intake = MobileOwnerWorkflow.shareIntake({ text: "https://mypersonas.online/#/push" });
    const feedCta = MobileOwnerWorkflow.stickyCtaPlan({ kind: "feed", online: true });
    const sites = MobileOwnerWorkflow.sitesToCheck({
      ownerId: owner,
      personaId: "persona-a",
      accounts: [{ id: "acc-1", owner, persona_id: "persona-a", provider: "twitter", url: "https://x.com/alpha" }],
      officialPortals: { twitter: "https://x.com/home" },
      origin: "https://mypersonas.online/",
    });
    const siteCount = sites.groups.reduce((sum, group) => sum + group.items.length, 0);
    document.getElementById("app").innerHTML = `
      <div class="oa-topbar"><div class="oa-brandline"><span class="oa-brandmark">A</span><div>
        <span class="oa-eyebrow">Fixture harness</span><h1 class="oa-title">Private feed + push ledger</h1></div></div></div>
      <div class="oa-capability">publishing_enabled=${String(MobileOwnerWorkflow.PUBLISHING_ENABLED)} · delivery_enabled=${String(push.deliveryEnabled)}</div>
      <article class="oa-brief new"><div class="oa-briefhead"><div><span class="oa-eyebrow">Alpha · owner_review</span><h3>${mine.headline}</h3></div></div>
        <p class="oa-summary">${mine.blurb}</p>
        <p class="oa-sub">Visible to owner: ${isolation.visibleToA} · visible to other: ${isolation.visibleToB}</p>
        <p class="oa-sub">Research: ${research.error}</p>
        <p class="oa-sub">Owner surface #/feed: ${feedSurface} · public persona hash: ${publicSurface}</p>
        <p class="oa-sub">Share intake: ${intake.note} · dest ${intake.destination}</p>
        <p class="oa-sub">Feed CTA: ${feedCta.primary.action}</p>
        <p class="oa-sub">Sites to check: ${siteCount} · install help: ${sites.groups[0].items[0].note}</p>
      </article>
      <div class="oa-empty"><strong>Push delivery off</strong>${push.reason}</div>
    `;
  </script>
</body>
</html>
